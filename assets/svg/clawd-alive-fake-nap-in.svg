<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* 0.5-Second One-Shot — Fake Nap In (intro of clawd-alive-fake-nap):
         from the exact rest pose he straightens up a touch, tucks both arms
         behind his back, and lets his eyes slide shut into flat lines with
         a little "innocent" settle. The last 10% holds the exact first frame
         of clawd-alive-fake-nap. */
      .action-body {
        transform-origin: 7.5px 15px;
        animation: fni-body 0.5s infinite ease-in-out;
      }

      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: fni-shadow 0.5s infinite ease-in-out;
      }

      .arm-l {
        animation: fni-arm-l 0.5s infinite ease-in-out;
      }

      .arm-r {
        animation: fni-arm-r 0.5s infinite ease-in-out;
      }

      .eyes-open {
        animation: fni-vis-open 0.5s infinite step-end;
      }

      .eyes-open-lid {
        transform-origin: 7.5px 10px;
        animation: fni-lid 0.5s infinite ease-in;
      }

      .eyes-shut {
        opacity: 0;
        animation: fni-vis-shut 0.5s infinite step-end;
      }

      .line-l {
        transform-origin: 4.5px 9.5px;
        animation: fni-line 0.5s infinite ease-out;
      }

      .line-r {
        transform-origin: 10.5px 9.5px;
        animation: fni-line 0.5s infinite ease-out;
      }

      /* --- Keyframes --- */

      /* Straighten up (stretch), small settle squash, still */
      @keyframes fni-body {
        0% { transform: scale(1, 1); }
        30% { transform: scale(0.97, 1.04); }
        58% { transform: scale(1.03, 0.97); }
        76% { transform: scale(0.995, 1.005); }
        88%, 100% { transform: scale(1, 1); }
      }

      @keyframes fni-shadow {
        0%, 88%, 100% { transform: scaleX(1); opacity: 0.5; }
        30% { transform: scaleX(0.97); opacity: 0.48; }
        58% { transform: scaleX(1.03); opacity: 0.52; }
      }

      /* Arms slide in behind the back (drawn under the torso) */
      @keyframes fni-arm-l {
        0%, 6% { transform: translate(0, 0); }
        18% { transform: translate(0, -0.3px); }
        44% { transform: translate(1.3px, 0); }
        60% { transform: translate(0.9px, 0); }
        74%, 100% { transform: translate(1px, 0); }
      }

      @keyframes fni-arm-r {
        0%, 8% { transform: translate(0, 0); }
        20% { transform: translate(0, -0.3px); }
        46% { transform: translate(-1.3px, 0); }
        62% { transform: translate(-0.9px, 0); }
        76%, 100% { transform: translate(-1px, 0); }
      }

      /* Open eyes slide shut from the top... */
      @keyframes fni-lid {
        0%, 22% { transform: scaleY(1); }
        44% { transform: scaleY(0.5); }
        100% { transform: scaleY(0.5); }
      }

      @keyframes fni-vis-open {
        0% { opacity: 1; }
        44% { opacity: 0; }
      }

      /* ...and become the flat "asleep" lines, widening out */
      @keyframes fni-vis-shut {
        0% { opacity: 0; }
        44% { opacity: 1; }
      }

      @keyframes fni-line {
        0%, 44% { transform: scaleX(0.5); }
        58% { transform: scaleX(1.15); }
        70%, 100% { transform: scaleX(1); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Static Legs -->
  <g id="legs" fill="#DE886D">
    <rect x="3" y="12" width="1" height="3"/>
    <rect x="5" y="12" width="1" height="3"/>
    <rect x="9" y="12" width="1" height="3"/>
    <rect x="11" y="12" width="1" height="3"/>
  </g>

  <!-- Animated Upper Body -->
  <g class="action-body">
    <!-- Arms first so the torso covers them (tucking behind the back) -->
    <g class="arm-l">
      <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
    </g>
    <g class="arm-r">
      <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
    </g>
    <!-- Torso -->
    <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
    <!-- Open eyes (rest) -->
    <g class="eyes-open">
      <g class="eyes-open-lid" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>
    </g>
    <!-- Eyes shut: flat lines -->
    <g class="eyes-shut" fill="#000000">
      <g class="line-l"><rect x="3.5" y="9" width="2" height="1"/></g>
      <g class="line-r"><rect x="9.5" y="9" width="2" height="1"/></g>
    </g>
  </g>
</svg>
