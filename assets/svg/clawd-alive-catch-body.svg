<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* 1.6-Second Loop — Catch (body): something lands right in front of
         his belly. Eyes drop to it, he rears back with both arms flung
         wide, then snaps forward and hugs it: both arms wrap in front of the
         torso (darker, like the shy hands) and the hands clasp at u 7.5,
         v 10. Happy "^^" squeeze and sway, then lets go and settles. */
      .body-jump {
        animation: body-jump 1.6s infinite ease-in-out;
      }

      .body-squash {
        transform-origin: 7.5px 13px;
        animation: body-squash 1.6s infinite ease-in-out;
      }

      .legs-jump {
        transform-origin: 7.5px 15px;
        animation: body-legs 1.6s infinite ease-in-out;
      }

      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: body-shadow 1.6s infinite ease-in-out;
      }

      .arm-l {
        transform-origin: 1px 11px;
        animation: body-arm-l 1.6s infinite ease-in-out;
      }

      .arm-r {
        transform-origin: 14px 11px;
        animation: body-arm-r 1.6s infinite ease-in-out;
      }

      .hug-l {
        opacity: 0;
        transform-origin: 0.5px 10px;
        animation: body-hug-l 1.6s infinite ease-in-out;
      }

      .hug-r {
        opacity: 0;
        transform-origin: 14.5px 10px;
        animation: body-hug-r 1.6s infinite ease-in-out;
      }

      .eyes-look {
        animation: body-look 1.6s infinite ease-in-out;
      }

      .eyes-blink {
        transform-origin: 7.5px 9px;
        animation: body-blink 1.6s infinite ease-in-out;
      }

      .eyes-open {
        animation: body-eyes-open 1.6s infinite step-end;
      }

      .eyes-happy {
        opacity: 0;
        animation: body-eyes-happy 1.6s infinite step-end;
      }

      /* --- Keyframes --- */

      /* Rise on the toes while rearing back, drop into the hug, happy
         little bounces while squeezing */
      @keyframes body-jump {
        0%, 8% { transform: translate(0, 0); }
        20%, 24% { transform: translate(0, -0.6px); }
        30% { transform: translate(0, 0.5px); }
        36% { transform: translate(0, 0); }
        46% { transform: translate(0, -0.5px); }
        52% { transform: translate(0, 0.2px); }
        60% { transform: translate(0, -0.5px); }
        66%, 100% { transform: translate(0, 0); }
      }

      @keyframes body-squash {
        0%, 8% { transform: scale(1, 1) rotate(0deg); }
        20%, 24% { transform: scale(0.94, 1.06) rotate(0deg); }
        30% { transform: scale(1.1, 0.9) rotate(0deg); }
        36% { transform: scale(1.04, 0.96) rotate(0deg); }
        42% { transform: scale(1.08, 0.92) rotate(0deg); }
        48% { transform: scale(1, 1) rotate(-3deg); }
        54% { transform: scale(1.08, 0.92) rotate(0deg); }
        60% { transform: scale(1, 1) rotate(3deg); }
        66% { transform: scale(1.06, 0.94) rotate(0deg); }
        72% { transform: scale(1, 1) rotate(-2deg); }
        78%, 82% { transform: scale(1.03, 0.97) rotate(0deg); }
        90% { transform: scale(0.98, 1.02) rotate(0deg); }
        96%, 100% { transform: scale(1, 1) rotate(0deg); }
      }

      @keyframes body-legs {
        0%, 8% { transform: scale(1, 1); }
        20%, 24% { transform: scale(1, 1.05); }
        30% { transform: scale(1, 0.85); }
        36%, 42% { transform: scale(1, 0.95); }
        48% { transform: scale(1, 1.03); }
        54% { transform: scale(1, 0.95); }
        60% { transform: scale(1, 1.03); }
        66%, 100% { transform: scale(1, 1); }
      }

      @keyframes body-shadow {
        0%, 8%, 66%, 100% { transform: scaleX(1); opacity: 0.5; }
        20%, 24% { transform: scaleX(0.94); opacity: 0.46; }
        30% { transform: scaleX(1.1); opacity: 0.55; }
        46%, 60% { transform: scaleX(0.95); opacity: 0.47; }
        54% { transform: scaleX(1.05); opacity: 0.52; }
      }

      /* Side arms fling wide and up, then swing in and tuck behind the
         hug; come back out at the end */
      @keyframes body-arm-l {
        0%, 8% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        20%, 24% { transform: translate(0, -0.3px) rotate(-38deg) scale(1.1, 1.6); }
        28% { transform: translate(1px, 0) rotate(0deg) scale(1, 1); }
        30%, 82% { transform: translate(2px, 0) rotate(0deg) scale(1, 1); }
        90% { transform: translate(-0.3px, 0) rotate(0deg) scale(1, 1); }
        95%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
      }

      @keyframes body-arm-r {
        0%, 8% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        20%, 24% { transform: translate(0, -0.3px) rotate(38deg) scale(1.1, 1.6); }
        28% { transform: translate(-1px, 0) rotate(0deg) scale(1, 1); }
        30%, 82% { transform: translate(-2px, 0) rotate(0deg) scale(1, 1); }
        90% { transform: translate(0.3px, 0) rotate(0deg) scale(1, 1); }
        95%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
      }

      /* Front arms sweep in from the sides and clasp (tiny overshoot),
         squeeze, then slide back out */
      @keyframes body-hug-l {
        0%, 25% { opacity: 0; transform: scale(0.15, 1); }
        26% { opacity: 1; transform: scale(0.2, 1); }
        29% { opacity: 1; transform: scale(0.75, 1); }
        31% { opacity: 1; transform: scale(1.06, 1); }
        34%, 82% { opacity: 1; transform: scale(1, 1); }
        88% { opacity: 1; transform: scale(0.3, 1); }
        89%, 100% { opacity: 0; transform: scale(0.15, 1); }
      }

      @keyframes body-hug-r {
        0%, 25% { opacity: 0; transform: scale(0.15, 1); }
        26% { opacity: 1; transform: scale(0.2, 1); }
        29% { opacity: 1; transform: scale(0.75, 1); }
        31% { opacity: 1; transform: scale(1.06, 1); }
        34%, 82% { opacity: 1; transform: scale(1, 1); }
        88% { opacity: 1; transform: scale(0.3, 1); }
        89%, 100% { opacity: 0; transform: scale(0.15, 1); }
      }

      /* Eyes drop to the belly the moment it arrives */
      @keyframes body-look {
        0%, 2% { transform: translate(0, 0); }
        6%, 26% { transform: translate(0, 1px); }
        30% { transform: translate(0, 0.3px); }
        88%, 100% { transform: translate(0, 0); }
      }

      @keyframes body-blink {
        0%, 2% { transform: scaleY(1); }
        5% { transform: scaleY(1.2); }
        10%, 18% { transform: scaleY(1); }
        24% { transform: scaleY(1.15); }
        30%, 92% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
        98%, 100% { transform: scaleY(1); }
      }

      @keyframes body-eyes-open {
        0% { opacity: 1; }
        32% { opacity: 0; }
        86% { opacity: 1; }
      }

      @keyframes body-eyes-happy {
        0% { opacity: 0; }
        32% { opacity: 1; }
        86% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs -->
  <g class="legs-jump">
    <g id="legs" fill="#DE886D">
      <rect x="3" y="12" width="1" height="3"/>
      <rect x="5" y="12" width="1" height="3"/>
      <rect x="9" y="12" width="1" height="3"/>
      <rect x="11" y="12" width="1" height="3"/>
    </g>
  </g>

  <!-- Animated Upper Body -->
  <g class="body-jump">
    <g class="body-squash">
      <!-- Torso -->
      <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <!-- Left Arm -->
      <g class="arm-l">
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Right Arm -->
      <g class="arm-r">
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Hugging arms in front of the torso, hands clasped at u 7.5, v 10 -->
      <g fill="#A85A3A">
        <g class="hug-l">
          <rect x="0.5" y="10.25" width="5.5" height="1"/>
          <rect class="fist" x="5.4" y="8.9" width="2.1" height="2.2"/>
        </g>
        <g class="hug-r">
          <rect x="9" y="10.25" width="5.5" height="1"/>
          <rect class="fist" x="7.5" y="8.9" width="2.1" height="2.2"/>
        </g>
      </g>
      <!-- Eyes (drop to the belly) -->
      <g class="eyes-open">
        <g class="eyes-look">
          <g class="eyes-blink" fill="#000000">
            <rect x="4" y="8" width="1" height="2"/>
            <rect x="10" y="8" width="1" height="2"/>
          </g>
        </g>
      </g>
      <!-- Happy "^^" eyes while squeezing -->
      <g class="eyes-happy" fill="#000000">
        <rect x="3" y="8" width="1" height="1"/>
        <rect x="4" y="7" width="1" height="1"/>
        <rect x="5" y="8" width="1" height="1"/>
        <rect x="9" y="8" width="1" height="1"/>
        <rect x="10" y="7" width="1" height="1"/>
        <rect x="11" y="8" width="1" height="1"/>
      </g>
    </g>
  </g>
</svg>
