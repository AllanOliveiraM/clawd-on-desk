<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* Walk, curious: replaces the roam walk visual while the window moves.
         0.3 s one-shot intro (wrapper groups, forwards) perks up out of the
         neutral rest pose of clawd-idle-follow.svg (small stretch tall, eyes
         turn to the walk direction). Then the stride loops on the inner
         groups (delay 0.3 s): 4 s loop, tiptoe steps at the crabwalk cadence
         (clawd-mini-crabwalk.svg: each leg pair steps once every 0.5 s) with
         a tiny bob per footfall. Eyes forward, a glance back over the
         shoulder (body turns a touch with it), forward again, a wide-eyed
         look up ahead with the front claw raised a little, then a quick
         double-take back and forward. Every loop starts at its rest value
         and the body stays within 1 unit / 2 deg of the rest pose, so the
         walk can be cut at any moment.
         Faces right (the walk direction); the app mirrors it for left. */
      .intro-body {
        transform-origin: 7.5px 15px;
        animation: cw-intro-body 0.3s ease-in-out forwards;
      }
      .intro-eyes {
        animation: cw-intro-eyes 0.3s ease-in-out forwards;
      }
      .bob {
        animation: cw-bob 0.25s 0.3s infinite ease-in-out;
      }
      .leg-1 { animation: cw-step-1 0.5s 0.3s infinite ease-in-out; transform-origin: top center; transform-box: fill-box; }
      .leg-2 { animation: cw-step-2 0.5s 0.3s infinite ease-in-out; transform-origin: top center; transform-box: fill-box; }
      .turn {
        transform-origin: 7.5px 13px;
        animation: cw-turn 4s 0.3s infinite ease-in-out;
      }
      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: cw-shadow 4s 0.3s infinite ease-in-out;
      }
      .arm-l {
        transform-origin: 2px 10px;
        animation: cw-arm-l 4s 0.3s infinite ease-in-out;
      }
      .arm-r {
        transform-origin: 13px 10px;
        animation: cw-arm-r 4s 0.3s infinite ease-in-out;
      }
      .eyes-look {
        animation: cw-look 4s 0.3s infinite ease-in-out;
      }
      .eyes-blink {
        transform-origin: 7.5px 9px;
        animation: cw-blink 4s 0.3s infinite ease-in-out;
      }

      /* --- Intro (one-shot) --- */
      @keyframes cw-intro-body {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(0.97, 1.04); }
      }
      @keyframes cw-intro-eyes {
        0% { transform: translate(0, 0); }
        100% { transform: translate(1.5px, 0); }
      }

      /* --- Stride --- */

      /* Tiny bob with every footfall */
      @keyframes cw-bob {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, -0.25px); }
      }

      /* Tiptoe steps: each pair lifts forward once per 0.5 s */
      @keyframes cw-step-1 {
        0%, 50%, 100% { transform: rotate(0deg) scaleY(1); }
        25% { transform: rotate(-25deg) scaleY(0.7); }
      }
      @keyframes cw-step-2 {
        0%, 50%, 100% { transform: rotate(0deg) scaleY(1); }
        75% { transform: rotate(-25deg) scaleY(0.7); }
      }

      /* Body turns slightly with the glances: back (lean left), forward,
         up ahead (lean in, stretch tall), double-take */
      @keyframes cw-turn {
        0%, 12% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        18%, 34% { transform: translate(-0.3px, 0) rotate(-2deg) scale(1, 1); }
        40%, 46% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        53%, 70% { transform: translate(0.4px, -0.2px) rotate(1.5deg) scale(0.97, 1.05); }
        76% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        80%, 85% { transform: translate(-0.2px, 0) rotate(-1.5deg) scale(1, 1); }
        90%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
      }
      @keyframes cw-shadow {
        0%, 12%, 40%, 46%, 76%, 90%, 100% { transform: translateX(0) scaleX(1); }
        18%, 34% { transform: translateX(-0.3px) scaleX(1); }
        53%, 70% { transform: translateX(0.4px) scaleX(0.97); }
        80%, 85% { transform: translateX(-0.2px) scaleX(1); }
      }

      /* Front (right) claw lifts a little while peering ahead */
      @keyframes cw-arm-r {
        0%, 48%, 76%, 100% { transform: translate(0, 0) rotate(0deg); }
        55% { transform: translate(0.3px, -1.2px) rotate(-30deg); }
        62% { transform: translate(0.3px, -1.4px) rotate(-36deg); }
        69% { transform: translate(0.3px, -1.2px) rotate(-30deg); }
      }
      /* Back (left) arm swings a touch with the glance over the shoulder */
      @keyframes cw-arm-l {
        0%, 12%, 40%, 100% { transform: translate(0, 0) rotate(0deg); }
        20%, 32% { transform: translate(0, -0.3px) rotate(12deg); }
      }

      /* Relative to the intro's forward look: back over the shoulder,
         forward, up ahead, double-take back, forward */
      @keyframes cw-look {
        0%, 12% { transform: translate(0, 0); }
        17%, 34% { transform: translate(-3.5px, 0); }
        40%, 47% { transform: translate(0, 0); }
        53%, 70% { transform: translate(0.5px, -1px); }
        76% { transform: translate(0, 0); }
        79%, 85% { transform: translate(-3px, 0); }
        90%, 100% { transform: translate(0, 0); }
      }

      /* Blink as the head turns forward again; eyes widen looking ahead */
      @keyframes cw-blink {
        0%, 36%, 44%, 50%, 74%, 100% { transform: scaleY(1); }
        40% { transform: scaleY(0.1); }
        55%, 69% { transform: scaleY(1.25); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <g class="intro-body">
    <!-- Legs (tiptoe) -->
    <g id="legs" fill="#DE886D">
      <rect id="outer-left-leg" class="leg-1" x="3" y="13" width="1" height="2"/>
      <rect id="inner-left-leg" class="leg-2" x="5" y="13" width="1" height="2"/>
      <rect id="inner-right-leg" class="leg-1" x="9" y="13" width="1" height="2"/>
      <rect id="outer-right-leg" class="leg-2" x="11" y="13" width="1" height="2"/>
    </g>

    <!-- Upper Body -->
    <g class="bob">
      <g class="turn">
        <!-- Left Arm -->
        <g class="arm-l">
          <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
        </g>
        <!-- Right Arm (front claw) -->
        <g class="arm-r">
          <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
        </g>
        <!-- Torso -->
        <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
        <!-- Eyes -->
        <g class="intro-eyes">
          <g class="eyes-look">
            <g class="eyes-blink" fill="#000000">
              <rect x="4" y="8" width="1" height="2"/>
              <rect x="10" y="8" width="1" height="2"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
