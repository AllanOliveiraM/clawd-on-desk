<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* 2.8-Second Loop — Morning Stretch: a little crouch, then a big stretch
         straight up: arms high overhead, body tall and thin, up on his toes,
         eyes squeezed shut, a small tremble at the peak. Lets go with a
         satisfied squash (arms flop down past rest and bounce back), then a
         slow happy blink. No yawn, no "z". */
      .action-body {
        transform-origin: 7.5px 13px;
        animation: stretch-body 2.8s infinite ease-in-out;
      }

      .legs-anim {
        transform-origin: 7.5px 15px;
        animation: stretch-legs 2.8s infinite ease-in-out;
      }

      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: stretch-shadow 2.8s infinite ease-in-out;
      }

      .arm-l {
        transform-origin: 1px 11px;
        animation: stretch-arm-l 2.8s infinite ease-in-out;
      }

      .arm-r {
        transform-origin: 14px 11px;
        animation: stretch-arm-r 2.8s infinite ease-in-out;
      }

      .eyes-lid {
        transform-origin: 7.5px 9.5px;
        animation: stretch-lid 2.8s infinite ease-in-out;
      }

      .eyes-look {
        animation: stretch-look 2.8s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      /* Crouch, rise tall (overshoot), tremble at the peak, drop into a
         satisfied squash, wobble back, small content exhale, settle */
      @keyframes stretch-body {
        0%, 5% { transform: translate(0, 0) scale(1, 1); }
        12% { transform: translate(0, 0.3px) scale(1.07, 0.92); }
        22% { transform: translate(0, -0.5px) scale(0.85, 1.27); }
        27% { transform: translate(0, -0.4px) scale(0.88, 1.22); }
        30% { transform: translate(0.12px, -0.4px) scale(0.87, 1.23); }
        32% { transform: translate(-0.12px, -0.4px) scale(0.88, 1.22); }
        34% { transform: translate(0.12px, -0.4px) scale(0.87, 1.23); }
        36% { transform: translate(-0.12px, -0.4px) scale(0.88, 1.22); }
        38% { transform: translate(0.12px, -0.4px) scale(0.87, 1.23); }
        40% { transform: translate(-0.12px, -0.4px) scale(0.88, 1.22); }
        42% { transform: translate(0.12px, -0.4px) scale(0.87, 1.23); }
        44% { transform: translate(0, -0.4px) scale(0.88, 1.22); }
        50% { transform: translate(0, 0.4px) scale(1.14, 0.86); }
        55% { transform: translate(0, -0.1px) scale(0.97, 1.04); }
        59% { transform: translate(0, 0) scale(1.02, 0.98); }
        63% { transform: translate(0, 0) scale(1, 1); }
        72%, 82% { transform: translate(0, 0.2px) scale(1.03, 0.96); }
        92%, 100% { transform: translate(0, 0) scale(1, 1); }
      }

      /* Up on tiptoes while stretching */
      @keyframes stretch-legs {
        0%, 5%, 50%, 100% { transform: scaleY(1); }
        12% { transform: scaleY(0.85); }
        22% { transform: scaleY(1.15); }
        27%, 44% { transform: scaleY(1.12); }
        48% { transform: scaleY(0.85); }
        55% { transform: scaleY(1.03); }
        59% { transform: scaleY(1); }
      }

      @keyframes stretch-shadow {
        0%, 5%, 63%, 100% { transform: scaleX(1); opacity: 0.5; }
        12% { transform: scaleX(1.06); opacity: 0.5; }
        22%, 44% { transform: scaleX(0.86); opacity: 0.42; }
        50% { transform: scaleX(1.12); opacity: 0.55; }
        72%, 82% { transform: scaleX(1.03); opacity: 0.5; }
      }

      /* Arms dip, sweep up high overhead (stay at the shoulders), tremble,
         flop down past rest and bounce back */
      @keyframes stretch-arm-l {
        0%, 5% { transform: translate(0, 0) scale(1, 1); }
        12% { transform: translate(0.3px, 0.6px) scale(1, 1); }
        17% { transform: translate(0.8px, -3px) scale(1, 1.6); }
        22% { transform: translate(1.3px, -4.6px) scale(1, 2.6); }
        27% { transform: translate(1.2px, -4.6px) scale(1, 2.4); }
        30% { transform: translate(1.3px, -4.6px) scale(1, 2.5); }
        32% { transform: translate(1.1px, -4.6px) scale(1, 2.4); }
        34% { transform: translate(1.3px, -4.6px) scale(1, 2.5); }
        36% { transform: translate(1.1px, -4.6px) scale(1, 2.4); }
        38% { transform: translate(1.3px, -4.6px) scale(1, 2.5); }
        40% { transform: translate(1.1px, -4.6px) scale(1, 2.4); }
        42% { transform: translate(1.3px, -4.6px) scale(1, 2.5); }
        44% { transform: translate(1.2px, -4.6px) scale(1, 2.4); }
        48% { transform: translate(0.4px, -1px) scale(1, 1.3); }
        51% { transform: translate(-0.2px, 1px) scale(1, 1); }
        56% { transform: translate(0, -0.4px) scale(1, 1); }
        61%, 100% { transform: translate(0, 0) scale(1, 1); }
      }

      @keyframes stretch-arm-r {
        0%, 5% { transform: translate(0, 0) scale(1, 1); }
        12% { transform: translate(-0.3px, 0.6px) scale(1, 1); }
        17% { transform: translate(-0.8px, -3px) scale(1, 1.6); }
        22% { transform: translate(-1.3px, -4.6px) scale(1, 2.6); }
        27% { transform: translate(-1.2px, -4.6px) scale(1, 2.4); }
        30% { transform: translate(-1.1px, -4.6px) scale(1, 2.5); }
        32% { transform: translate(-1.3px, -4.6px) scale(1, 2.4); }
        34% { transform: translate(-1.1px, -4.6px) scale(1, 2.5); }
        36% { transform: translate(-1.3px, -4.6px) scale(1, 2.4); }
        38% { transform: translate(-1.1px, -4.6px) scale(1, 2.5); }
        40% { transform: translate(-1.3px, -4.6px) scale(1, 2.4); }
        42% { transform: translate(-1.1px, -4.6px) scale(1, 2.5); }
        44% { transform: translate(-1.2px, -4.6px) scale(1, 2.4); }
        48% { transform: translate(-0.4px, -1px) scale(1, 1.3); }
        51% { transform: translate(0.2px, 1px) scale(1, 1); }
        56% { transform: translate(0, -0.4px) scale(1, 1); }
        61%, 100% { transform: translate(0, 0) scale(1, 1); }
      }

      /* Squeezed shut through the stretch, pop open, then one slow,
         satisfied blink (sink, hold, reopen) */
      @keyframes stretch-lid {
        0%, 8%, 54%, 66%, 92%, 100% { transform: scaleY(1); }
        16%, 46% { transform: scaleY(0.1); }
        51% { transform: scaleY(0.4); }
        72% { transform: scaleY(0.5); }
        77%, 83% { transform: scaleY(0.1); }
        88% { transform: scaleY(0.5); }
      }

      @keyframes stretch-look {
        0%, 8% { transform: translate(0, 0); }
        16%, 46% { transform: translate(0, -0.5px); }
        54%, 100% { transform: translate(0, 0); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs (tiptoe while stretching) -->
  <g class="legs-anim">
    <g id="legs" fill="#DE886D">
      <rect x="3" y="12" width="1" height="3"/>
      <rect x="5" y="12" width="1" height="3"/>
      <rect x="9" y="12" width="1" height="3"/>
      <rect x="11" y="12" width="1" height="3"/>
    </g>
  </g>

  <!-- Animated Upper Body -->
  <g class="action-body">
    <!-- Torso -->
    <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
    <!-- Left Arm -->
    <g class="arm-l">
      <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
    </g>
    <!-- Right Arm -->
    <g class="arm-r">
      <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
    </g>
    <!-- Eyes (lids close from the top) -->
    <g class="eyes-look">
      <g class="eyes-lid" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>
    </g>
  </g>
</svg>
