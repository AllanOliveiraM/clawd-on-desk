<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* 2.2-Second Loop — Catch miss (high): same reach as catch-high (eyes
         roll up a little cross-eyed, small hop, lean and short cat-like paw swat
         up to just above the head top, paw tip about u 11, v 4.5)... but it slips away. He bats
         after it twice more, eyes darting, overreaches, loses his balance and
         lands on his bottom with a bounce, shakes his head (eye wobble),
         looks away embarrassed with a double blink, scratches his head and
         stands back up (same tail as clawd-alive-catch-miss.svg). */
      .body-jump {
        animation: mswat-jump 2.2s infinite ease-in-out;
      }

      .body-tilt {
        transform-origin: 7.5px 15px;
        animation: mswat-tilt 2.2s infinite ease-in-out;
      }

      .body-squash {
        transform-origin: 7.5px 13px;
        animation: mswat-squash 2.2s infinite ease-in-out;
      }

      .legs-jump {
        transform-origin: 7.5px 15px;
        animation: mswat-legs 2.2s infinite ease-in-out;
      }

      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: mswat-shadow 2.2s infinite ease-in-out;
      }

      .arm-l {
        transform-origin: 1px 11px;
        animation: mswat-arm-l 2.2s infinite ease-in-out;
      }

      .arm-r {
        transform-origin: 14px 11px;
        animation: mswat-arm-r 2.2s infinite ease-in-out;
      }

      .eyes-look {
        animation: mswat-look 2.2s infinite ease-in-out;
      }

      .eye-l {
        animation: mswat-eye-l 2.2s infinite ease-in-out;
      }

      .eye-r {
        animation: mswat-eye-r 2.2s infinite ease-in-out;
      }

      .eyes-blink {
        transform-origin: 7.5px 9px;
        animation: mswat-blink 2.2s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      @keyframes mswat-jump {
        0%, 5% { transform: translate(0, 0); }
        10.2%, 12.7% { transform: translate(0px, 1px); }
        15.3% { transform: translate(0px, -0.7px); }
        17.8% { transform: translate(0px, -1px); }
        21% { transform: translate(0px, -0.3px); }
        23.5% { transform: translate(0px, 0.1px); }
        27% { transform: translate(0, 0); }
        31% { transform: translate(0px, -0.6px); }
        35% { transform: translate(0, 0); }
        39% { transform: translate(0px, -0.7px); }
        43% { transform: translate(0px, -0.4px); }
        46% { transform: translate(0, 0); }
        49% { transform: translate(0px, 2.4px); }
        55% { transform: translate(0px, -1.2px); }
        61% { transform: translate(0px, 2.2px); }
        64%, 88% { transform: translate(0px, 2px); }
        94% { transform: translate(0px, -0.5px); }
        100% { transform: translate(0, 0); }
      }

      @keyframes mswat-tilt {
        0%, 5% { transform: rotate(0deg); }
        10.2%, 12.7% { transform: rotate(3deg); }
        15.3% { transform: rotate(-6deg); }
        21% { transform: rotate(-7deg); }
        24% { transform: rotate(-4deg); }
        27% { transform: rotate(-2deg); }
        31% { transform: rotate(-6deg); }
        35% { transform: rotate(-2deg); }
        39% { transform: rotate(-8deg); }
        43% { transform: rotate(-9deg); }
        46% { transform: rotate(-5deg); }
        49%, 62% { transform: rotate(0deg); }
        64.5% { transform: rotate(4deg); }
        67.5% { transform: rotate(-4deg); }
        70.5% { transform: rotate(3.5deg); }
        73.5% { transform: rotate(-3deg); }
        76.5% { transform: rotate(1.5deg); }
        79% { transform: rotate(0deg); }
        83%, 89% { transform: rotate(-2.5deg); }
        95%, 100% { transform: rotate(0deg); }
      }

      @keyframes mswat-squash {
        0%, 5% { transform: scale(1, 1); }
        10.2%, 12.7% { transform: scale(1.1, 0.88); }
        15.3% { transform: scale(0.95, 1.06); }
        17.8% { transform: scale(0.97, 1.03); }
        21% { transform: scale(0.99, 1.01); }
        23.5% { transform: scale(1.04, 0.96); }
        27% { transform: scale(1, 1); }
        31% { transform: scale(0.96, 1.05); }
        35% { transform: scale(1.03, 0.97); }
        39% { transform: scale(0.95, 1.06); }
        46% { transform: scale(0.9, 1.12); }
        49% { transform: scale(1.2, 0.78); }
        55% { transform: scale(0.95, 1.06); }
        61% { transform: scale(1.12, 0.85); }
        65% { transform: scale(1.04, 0.96); }
        83%, 88% { transform: scale(1.02, 0.95); }
        94% { transform: scale(0.96, 1.05); }
        100% { transform: scale(1, 1); }
      }

      @keyframes mswat-legs {
        0%, 5% { transform: translate(0, 0) scale(1, 1); }
        10.2%, 12.7% { transform: translate(0, 0) scale(1, 0.7); }
        15.3% { transform: translate(0px, -0.6px) scale(1, 1.1); }
        17.8% { transform: translate(0px, -1px) scale(1, 1); }
        21% { transform: translate(0px, -0.3px) scale(1, 1); }
        23.5% { transform: translate(0, 0) scale(1, 0.85); }
        27% { transform: translate(0, 0) scale(1, 1); }
        31% { transform: translate(0px, -0.4px) scale(1, 1.05); }
        35% { transform: translate(0, 0) scale(1, 0.95); }
        39% { transform: translate(0px, -0.5px) scale(1, 1.05); }
        46% { transform: translate(0px, -0.3px) scale(1, 1.05); }
        49% { transform: translate(0, 0) scale(1, 0.34); }
        55% { transform: translate(0px, -1.2px) scale(1, 0.9); }
        61%, 88% { transform: translate(0, 0) scale(1, 0.34); }
        94% { transform: translate(0, 0) scale(1, 1.08); }
        100% { transform: translate(0, 0) scale(1, 1); }
      }

      @keyframes mswat-shadow {
        0%, 5% { transform: scaleX(1); opacity: 0.5; }
        10.2%, 12.7% { transform: scaleX(1.1); opacity: 0.55; }
        17.8% { transform: scaleX(0.84); opacity: 0.4; }
        23.5% { transform: scaleX(1.06); opacity: 0.53; }
        27% { transform: scaleX(1); opacity: 0.5; }
        31% { transform: scaleX(0.92); opacity: 0.46; }
        35% { transform: scaleX(1); opacity: 0.5; }
        39% { transform: scaleX(0.9); opacity: 0.45; }
        49% { transform: scaleX(1.24); opacity: 0.6; }
        55% { transform: scaleX(0.9); opacity: 0.45; }
        61% { transform: scaleX(1.18); opacity: 0.58; }
        65%, 88% { transform: scaleX(1.1); opacity: 0.55; }
        94% { transform: scaleX(0.97); opacity: 0.5; }
        100% { transform: scaleX(1); opacity: 0.5; }
      }

      @keyframes mswat-arm-l {
        0%, 5% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        10.2%, 12.7% { transform: translate(0px, 0.5px) rotate(-20deg) scale(1, 1); }
        15.3% { transform: translate(-0.3px, 0px) rotate(-45deg) scale(1, 1.2); }
        17.8% { transform: translate(-0.3px, -0.2px) rotate(-30deg) scale(1, 1.2); }
        21% { transform: translate(0, 0) rotate(-40deg) scale(1, 1.1); }
        27% { transform: translate(0px, 0.3px) rotate(-10deg) scale(1, 1); }
        31% { transform: translate(-0.3px, -0.3px) rotate(-50deg) scale(1, 1.3); }
        35% { transform: translate(0, 0) rotate(-20deg) scale(1, 1); }
        39% { transform: translate(-0.4px, -0.5px) rotate(-60deg) scale(1, 1.4); }
        43% { transform: translate(-0.5px, -0.8px) rotate(-75deg) scale(1, 1.5); }
        46% { transform: translate(-0.5px, -0.5px) rotate(-45deg) scale(1, 1.2); }
        49% { transform: translate(-0.5px, 0px) rotate(-40deg) scale(1, 1); }
        55% { transform: translate(0px, -1.5px) rotate(-20deg) scale(1, 1.4); }
        61% { transform: translate(0px, 0.5px) rotate(-10deg) scale(1, 1); }
        65%, 90% { transform: translate(0px, 0.5px) rotate(0deg) scale(1, 1); }
        96%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
      }

      @keyframes mswat-arm-r {
        0% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
        5% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
        10.2% { transform: translate(0.3px, 0.6px) rotate(35deg) scale(1, 1); }
        12.7% { transform: translate(0.3px, 0.6px) rotate(40deg) scale(1, 1); }
        15.3% { transform: translate(-0.6px, -3.6px) rotate(-36deg) scale(1, 1.5); }
        17.8% { transform: translate(-0.5px, -3px) rotate(-5deg) scale(1, 1.35); }
        21% { transform: translate(-0.6px, -3.5px) rotate(-20deg) scale(1, 1.5); }
        24% { transform: translate(-0.7px, -3.6px) rotate(-46deg) scale(1, 1.5); }
        27% { transform: translate(-0.5px, -3px) rotate(-5deg) scale(1, 1.35); }
        31% { transform: translate(-0.7px, -3.7px) rotate(-42deg) scale(1, 1.5); }
        35% { transform: translate(-0.5px, -3px) rotate(-10deg) scale(1, 1.35); }
        39% { transform: translate(-0.8px, -3.8px) rotate(-52deg) scale(1, 1.5); }
        43% { transform: translate(-0.4px, -2px) rotate(-30deg) scale(1, 1.2); }
        46% { transform: translate(0.4px, -0.5px) rotate(30deg) scale(1, 1.2); }
        49% { transform: translate(0.5px, 0px) rotate(40deg) scale(1, 1); }
        55% { transform: translate(0px, -1.5px) rotate(20deg) scale(1, 1.4); }
        61% { transform: translate(0px, 0.5px) rotate(10deg) scale(1, 1); }
        66%, 78% { transform: translate(0px, 0.5px) rotate(0deg) scale(1, 1); }
        81% { transform: translate(-0.5px, -3px) rotate(-12deg) scale(1, 1.5); }
        83% { transform: translate(-0.5px, -3.3px) rotate(4deg) scale(1, 1.5); }
        85% { transform: translate(-0.5px, -3px) rotate(-12deg) scale(1, 1.5); }
        87% { transform: translate(-0.5px, -3.3px) rotate(4deg) scale(1, 1.5); }
        89% { transform: translate(-0.5px, -3px) rotate(-8deg) scale(1, 1.5); }
        94%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
      }

      @keyframes mswat-look {
        0%, 2% { transform: translate(0, 0); }
        4%, 21% { transform: translate(0.4px, -1.5px); }
        24% { transform: translate(-1.2px, -1.8px); }
        28% { transform: translate(1.5px, -1.6px); }
        32% { transform: translate(-1.5px, -1.6px); }
        36% { transform: translate(1.8px, -1.2px); }
        41% { transform: translate(-1.5px, -1px); }
        46% { transform: translate(0px, -0.8px); }
        48%, 62% { transform: translate(0, 0); }
        64.5% { transform: translate(1px, 0px); }
        67.5% { transform: translate(-1px, 0px); }
        70.5% { transform: translate(1px, 0px); }
        73.5% { transform: translate(-1px, 0px); }
        76.5% { transform: translate(0.5px, 0px); }
        79% { transform: translate(0, 0); }
        82%, 90% { transform: translate(-1.5px, 0.5px); }
        96%, 100% { transform: translate(0, 0); }
      }

      @keyframes mswat-eye-l {
        0%, 2% { transform: translate(0, 0); }
        4%, 21% { transform: translate(0.6px, 0px); }
        26%, 100% { transform: translate(0, 0); }
      }

      @keyframes mswat-eye-r {
        0%, 2% { transform: translate(0, 0); }
        4%, 21% { transform: translate(-0.6px, 0px); }
        26%, 100% { transform: translate(0, 0); }
      }

      @keyframes mswat-blink {
        0%, 2% { transform: scaleY(1); }
        4% { transform: scaleY(1.2); }
        10%, 12.7% { transform: scaleY(0.75); }
        15.3%, 21% { transform: scaleY(1.15); }
        24% { transform: scaleY(1.3); }
        44% { transform: scaleY(1.25); }
        48% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
        55% { transform: scaleY(1); }
        62%, 78% { transform: scaleY(0.75); }
        81% { transform: scaleY(1); }
        84% { transform: scaleY(0.1); }
        86% { transform: scaleY(1); }
        88% { transform: scaleY(0.1); }
        90%, 100% { transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs -->
  <g class="legs-jump">
    <g id="legs" fill="#DE886D">
      <rect x="3" y="12" width="1" height="3"/>
      <rect x="5" y="12" width="1" height="3"/>
      <rect x="9" y="12" width="1" height="3"/>
      <rect x="11" y="12" width="1" height="3"/>
    </g>
  </g>

  <!-- Animated Upper Body -->
  <g class="body-jump">
    <g class="body-tilt">
    <g class="body-squash">
      <!-- Torso -->
      <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <!-- Left Arm (balance) -->
      <g class="arm-l">
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Right Arm (the swatting paw; stretches to 3 units at most) -->
      <g class="arm-r">
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Eyes: look up, a little cross-eyed -->
      <g class="eyes-open">
        <g class="eyes-look">
          <g class="eyes-blink" fill="#000000">
            <g class="eye-l"><rect x="4" y="8" width="1" height="2"/></g>
            <g class="eye-r"><rect x="10" y="8" width="1" height="2"/></g>
          </g>
        </g>
      </g>
    </g>
    </g>
  </g>
</svg>
