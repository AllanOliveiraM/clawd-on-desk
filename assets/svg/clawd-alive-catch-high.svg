<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* 1.4-Second Loop — Catch (high): something sits right on top of his
         head. Eyes roll up (a little cross-eyed), quick crouch with the right
         arm cocked back, small hop and a short cat-like paw swat: he leans
         over and the right arm (never longer than 3 units) bats up past the
         head corner, a second bat pins it just above the head top (paw tip
         about u 11, v 4.5). Holds it with a happy "^^" wiggle, lowers the paw and
         settles. The left arm only flicks out for balance. */
      .body-jump {
        animation: swat-jump 1.4s infinite ease-in-out;
      }

      .body-squash {
        transform-origin: 7.5px 13px;
        animation: swat-squash 1.4s infinite ease-in-out;
      }

      .legs-jump {
        transform-origin: 7.5px 15px;
        animation: swat-legs 1.4s infinite ease-in-out;
      }

      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: swat-shadow 1.4s infinite ease-in-out;
      }

      .arm-l {
        transform-origin: 1px 11px;
        animation: swat-arm-l 1.4s infinite ease-in-out;
      }

      .arm-r {
        transform-origin: 14px 11px;
        animation: swat-arm-r 1.4s infinite ease-in-out;
      }

      .eyes-look {
        animation: swat-look 1.4s infinite ease-in-out;
      }

      .eye-l {
        animation: swat-eye-l 1.4s infinite ease-in-out;
      }

      .eye-r {
        animation: swat-eye-r 1.4s infinite ease-in-out;
      }

      .eyes-blink {
        transform-origin: 7.5px 9px;
        animation: swat-blink 1.4s infinite ease-in-out;
      }

      .eyes-open {
        animation: swat-eyes-open 1.4s infinite step-end;
      }

      .eyes-happy {
        opacity: 0;
        animation: swat-eyes-happy 1.4s infinite step-end;
      }

      /* --- Keyframes --- */

      @keyframes swat-jump {
        0%, 8% { transform: translate(0, 0); }
        16%, 20% { transform: translate(0px, 1px); }
        24% { transform: translate(0px, -0.7px); }
        28% { transform: translate(0px, -1px); }
        33% { transform: translate(0px, -0.3px); }
        37% { transform: translate(0px, 0.15px); }
        41% { transform: translate(0px, -0.15px); }
        45%, 100% { transform: translate(0, 0); }
      }

      @keyframes swat-squash {
        0%, 8% { transform: scale(1, 1) rotate(0deg); }
        16%, 20% { transform: scale(1.1, 0.88) rotate(3deg); }
        24% { transform: scale(0.95, 1.06) rotate(-7deg); }
        28% { transform: scale(0.97, 1.03) rotate(-5deg); }
        33% { transform: scale(0.98, 1.02) rotate(-7deg); }
        37% { transform: scale(1.04, 0.96) rotate(-5deg); }
        41% { transform: scale(0.99, 1.01) rotate(-5deg); }
        45% { transform: scale(1, 1) rotate(-5deg); }
        52% { transform: scale(1.02, 0.98) rotate(-7deg); }
        60% { transform: scale(1, 1) rotate(-3deg); }
        68% { transform: scale(1.02, 0.98) rotate(-6deg); }
        76% { transform: scale(1, 1) rotate(-5deg); }
        84% { transform: scale(1, 1) rotate(-1deg); }
        88% { transform: scale(1.03, 0.97) rotate(0deg); }
        94%, 100% { transform: scale(1, 1) rotate(0deg); }
      }

      @keyframes swat-legs {
        0%, 8% { transform: translate(0, 0) scale(1, 1); }
        16%, 20% { transform: translate(0, 0) scale(1, 0.7); }
        24% { transform: translate(0px, -0.6px) scale(1, 1.1); }
        28% { transform: translate(0px, -1px) scale(1, 1); }
        33% { transform: translate(0px, -0.3px) scale(1, 1); }
        37% { transform: translate(0, 0) scale(1, 0.85); }
        41%, 84% { transform: translate(0, 0) scale(1, 1); }
        88% { transform: translate(0, 0) scale(1, 0.92); }
        94%, 100% { transform: translate(0, 0) scale(1, 1); }
      }

      @keyframes swat-shadow {
        0%, 8% { transform: scaleX(1); opacity: 0.5; }
        16%, 20% { transform: scaleX(1.1); opacity: 0.55; }
        28% { transform: scaleX(0.84); opacity: 0.4; }
        37% { transform: scaleX(1.06); opacity: 0.53; }
        45%, 100% { transform: scaleX(1); opacity: 0.5; }
      }

      @keyframes swat-arm-l {
        0%, 8% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        16%, 20% { transform: translate(0px, 0.5px) rotate(-20deg) scale(1, 1); }
        24% { transform: translate(-0.3px, 0px) rotate(-45deg) scale(1, 1.2); }
        28% { transform: translate(-0.3px, -0.2px) rotate(-30deg) scale(1, 1.2); }
        33% { transform: translate(0, 0) rotate(-40deg) scale(1, 1.1); }
        38% { transform: translate(0px, 0.3px) rotate(-15deg) scale(1, 1); }
        44%, 88% { transform: translate(0px, 0.3px) rotate(0deg) scale(1, 1); }
        94%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
      }

      @keyframes swat-arm-r {
        0% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
        8% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
        16% { transform: translate(0.3px, 0.6px) rotate(35deg) scale(1, 1); }
        20% { transform: translate(0.3px, 0.6px) rotate(40deg) scale(1, 1); }
        24% { transform: translate(-0.6px, -3.6px) rotate(-36deg) scale(1, 1.5); }
        28% { transform: translate(-0.5px, -3px) rotate(-5deg) scale(1, 1.35); }
        33% { transform: translate(-0.6px, -3.5px) rotate(-20deg) scale(1, 1.5); }
        36% { transform: translate(-0.6px, -3.5px) rotate(-26deg) scale(1, 1.5); }
        40% { transform: translate(-0.6px, -3.5px) rotate(-20deg) scale(1, 1.5); }
        76% { transform: translate(-0.6px, -3.5px) rotate(-20deg) scale(1, 1.5); }
        82% { transform: translate(-0.4px, -2px) rotate(-8deg) scale(1, 1.2); }
        88% { transform: translate(0px, -0.4px) rotate(0deg) scale(1, 1); }
        93% { transform: translate(0px, 0.3px) rotate(8deg) scale(1, 1); }
        97% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
        100% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
      }

      @keyframes swat-look {
        0%, 3% { transform: translate(0, 0); }
        6%, 40% { transform: translate(0.4px, -1.5px); }
        88%, 100% { transform: translate(0, 0); }
      }

      @keyframes swat-eye-l {
        0%, 3% { transform: translate(0, 0); }
        6%, 40% { transform: translate(0.6px, 0px); }
        88%, 100% { transform: translate(0, 0); }
      }

      @keyframes swat-eye-r {
        0%, 3% { transform: translate(0, 0); }
        6%, 40% { transform: translate(-0.6px, 0px); }
        88%, 100% { transform: translate(0, 0); }
      }

      @keyframes swat-blink {
        0%, 3% { transform: scaleY(1); }
        6% { transform: scaleY(1.2); }
        16%, 20% { transform: scaleY(0.75); }
        24%, 38% { transform: scaleY(1.15); }
        42%, 92% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
        98%, 100% { transform: scaleY(1); }
      }

      @keyframes swat-eyes-open {
        0% { opacity: 1; }
        41% { opacity: 0; }
        88% { opacity: 1; }
      }

      @keyframes swat-eyes-happy {
        0% { opacity: 0; }
        41% { opacity: 1; }
        88% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs -->
  <g class="legs-jump">
    <g id="legs" fill="#DE886D">
      <rect x="3" y="12" width="1" height="3"/>
      <rect x="5" y="12" width="1" height="3"/>
      <rect x="9" y="12" width="1" height="3"/>
      <rect x="11" y="12" width="1" height="3"/>
    </g>
  </g>

  <!-- Animated Upper Body -->
  <g class="body-jump">
    <g class="body-squash">
      <!-- Torso -->
      <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <!-- Left Arm (balance) -->
      <g class="arm-l">
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Right Arm (the swatting paw; stretches to 3 units at most) -->
      <g class="arm-r">
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Eyes: look up, a little cross-eyed -->
      <g class="eyes-open">
        <g class="eyes-look">
          <g class="eyes-blink" fill="#000000">
            <g class="eye-l"><rect x="4" y="8" width="1" height="2"/></g>
            <g class="eye-r"><rect x="10" y="8" width="1" height="2"/></g>
          </g>
        </g>
      </g>
      <!-- Satisfied "^^" eyes after the swat connects -->
      <g class="eyes-happy" fill="#000000">
        <rect x="3" y="9" width="1" height="1"/>
        <rect x="4" y="8" width="1" height="1"/>
        <rect x="5" y="9" width="1" height="1"/>
        <rect x="9" y="9" width="1" height="1"/>
        <rect x="10" y="8" width="1" height="1"/>
        <rect x="11" y="9" width="1" height="1"/>
      </g>
    </g>
  </g>
</svg>
