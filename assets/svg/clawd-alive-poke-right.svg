<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* Exact mirror of the -left file (whole art flipped around x = 7.5).
         2-Second Loop — Poke (right): eyes on something to the right, winds
         the arm back, two quick jabs to the RIGHT with recoil (the second a
         bit bolder), then turns his eyes to you with a little head tilt and
         a double blink — "did you see that?" — and relaxes. */
      .action-body {
        transform-origin: 7.5px 15px;
        animation: poke-lean 2s infinite ease-in-out;
      }

      .body-squash {
        transform-origin: 7.5px 13px;
        animation: poke-squash 2s infinite ease-in-out;
      }

      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: poke-shadow 2s infinite ease-in-out;
      }

      .leg-brace {
        animation: poke-brace 2s infinite ease-in-out;
      }

      .arm-l {
        transform-origin: 2px 10px;
        animation: poke-arm-l 2s infinite ease-in-out;
      }

      .arm-r {
        transform-origin: 13px 10px;
        animation: poke-arm-r 2s infinite ease-in-out;
      }

      .eyes-look {
        animation: poke-look 2s infinite ease-in-out;
      }

      .eyes-blink {
        transform-origin: 7.5px 9px;
        animation: poke-blink 2s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      /* Lean back to wind up, into each jab, recoil; turn to you with a
         small curious tilt; straighten */
      @keyframes poke-lean {
        0%, 6% { transform: translate(0, 0) rotate(0deg); }
        13% { transform: translate(0.4px, 0) rotate(2deg); }
        17% { transform: translate(-0.8px, 0) rotate(-4deg); }
        22% { transform: translate(0.2px, 0) rotate(1deg); }
        25% { transform: translate(0.3px, 0) rotate(1.5deg); }
        29% { transform: translate(-1px, 0) rotate(-5deg); }
        34% { transform: translate(0.2px, 0) rotate(1.5deg); }
        38% { transform: translate(0, 0) rotate(0deg); }
        44% { transform: translate(0, -0.4px) rotate(4deg); }
        48%, 76% { transform: translate(0, 0) rotate(3deg); }
        86%, 100% { transform: translate(0, 0) rotate(0deg); }
      }

      @keyframes poke-squash {
        0%, 6% { transform: scale(1, 1); }
        13% { transform: scale(0.97, 1.03); }
        17% { transform: scale(1.05, 0.96); }
        22% { transform: scale(0.99, 1.01); }
        25% { transform: scale(0.97, 1.03); }
        29% { transform: scale(1.06, 0.95); }
        34% { transform: scale(0.99, 1.01); }
        38% { transform: scale(1, 1); }
        42% { transform: scale(0.97, 1.04); }
        47% { transform: scale(1.02, 0.98); }
        52%, 100% { transform: scale(1, 1); }
      }

      @keyframes poke-shadow {
        0%, 6%, 38%, 100% { transform: scaleX(1) translate(0, 0); opacity: 0.5; }
        17%, 29% { transform: scaleX(1.05) translate(-0.5px, 0); opacity: 0.52; }
        13%, 25% { transform: scaleX(1) translate(0.3px, 0); opacity: 0.5; }
      }

      /* Front foot braces on each jab */
      @keyframes poke-brace {
        0%, 13%, 21%, 25%, 33%, 100% { transform: translate(0, 0); }
        17%, 29% { transform: translate(-0.5px, 0); }
      }

      /* Arm: pull back, JAB, recoil, pull back, bigger JAB, recoil, hold
         half out while looking at you, tuck back */
      @keyframes poke-arm-l {
        0%, 6% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        13% { transform: translate(0.8px, 0) rotate(-6deg) scale(0.8, 1); }
        16% { transform: translate(0, -0.3px) rotate(6deg) scale(2.8, 1); }
        18.5% { transform: translate(0, -0.3px) rotate(5deg) scale(2.6, 1); }
        22% { transform: translate(0.3px, 0) rotate(0deg) scale(1.1, 1); }
        25% { transform: translate(0.8px, 0) rotate(-6deg) scale(0.8, 1); }
        28% { transform: translate(0, -0.3px) rotate(7deg) scale(3.1, 1); }
        30.5% { transform: translate(0, -0.3px) rotate(6deg) scale(2.9, 1); }
        34% { transform: translate(0.3px, 0) rotate(0deg) scale(1.2, 1); }
        38% { transform: translate(0, 0) rotate(-4deg) scale(1.5, 1); }
        76% { transform: translate(0, 0) rotate(-4deg) scale(1.4, 1); }
        86%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
      }

      /* Back arm counter-swings for balance on each jab */
      @keyframes poke-arm-r {
        0%, 6%, 38%, 100% { transform: translate(0, 0) rotate(0deg); }
        13%, 25% { transform: translate(0, 0) rotate(8deg); }
        17%, 29% { transform: translate(0, -0.3px) rotate(-18deg); }
        22%, 34% { transform: translate(0, 0) rotate(0deg); }
      }

      /* On the target for both jabs, then snap to you, hold, back home */
      @keyframes poke-look {
        0% { transform: translate(0, 0); }
        5%, 36% { transform: translate(-1.5px, 0); }
        41% { transform: translate(0.4px, 0.3px); }
        44%, 76% { transform: translate(0, 0.3px); }
        84%, 100% { transform: translate(0, 0); }
      }

      /* Squint on each jab, wide when turning to you, double blink */
      @keyframes poke-blink {
        0%, 6%, 13%, 22%, 25%, 34% { transform: scaleY(1); }
        17%, 29% { transform: scaleY(0.6); }
        40% { transform: scaleY(1); }
        44%, 54% { transform: scaleY(1.2); }
        58% { transform: scaleY(1); }
        60% { transform: scaleY(0.1); }
        62.5% { transform: scaleY(1); }
        65% { transform: scaleY(0.1); }
        67.5%, 100% { transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- Mirrored: everything below is the -left art flipped horizontally -->
  <g transform="translate(15 0) scale(-1 1)">

    <!-- Ground Shadow -->
    <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

    <!-- Legs (front-left foot braces) -->
    <g id="legs" fill="#DE886D">
      <g class="leg-brace"><rect x="3" y="12" width="1" height="3"/></g>
      <rect x="5" y="12" width="1" height="3"/>
      <rect x="9" y="12" width="1" height="3"/>
      <rect x="11" y="12" width="1" height="3"/>
    </g>

    <!-- Animated Upper Body -->
    <g class="action-body">
      <g class="body-squash">
        <!-- Torso -->
        <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
        <!-- Left Arm (pokes) -->
        <g class="arm-l">
          <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
        </g>
        <!-- Right Arm -->
        <g class="arm-r">
          <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
        </g>
        <!-- Eyes -->
        <g class="eyes-look">
          <g class="eyes-blink" fill="#000000">
            <rect x="4" y="8" width="1" height="2"/>
            <rect x="10" y="8" width="1" height="2"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
