<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* 3-Second Loop — Reach Close: looks up at something out of reach,
         jumps with both arms up, jumps again higher (one arm stretching
         further, little tremble at the top), misses, lands with a big squash,
         then crosses his arms and pouts (narrowed eyes, puffed cheeks, looks
         away, one sulky glance back up). Grumpy but cute: no red tint,
         no "!" or alert icons. */
      .hop {
        animation: reach-hop 3s infinite ease-in-out;
      }

      .action-body {
        transform-origin: 7.5px 13px;
        animation: reach-body 3s infinite ease-in-out;
      }

      .legs-crouch {
        transform-origin: 7.5px 15px;
        animation: reach-legs-crouch 3s infinite ease-in-out;
      }

      .legs-dangle {
        transform-origin: 7.5px 12px;
        animation: reach-legs-dangle 3s infinite ease-in-out;
      }

      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: reach-shadow 3s infinite ease-in-out;
      }

      .arm-l {
        transform-origin: 1px 11px;
        animation: reach-arm-l 3s infinite ease-in-out;
      }

      .arm-r {
        transform-origin: 14px 11px;
        animation: reach-arm-r 3s infinite ease-in-out;
      }

      .arms-crossed,
      .brows {
        opacity: 0;
        animation: reach-pout 3s infinite ease-in-out;
      }

      .eyes-look {
        animation: reach-look 3s infinite ease-in-out;
      }

      .eyes-lid {
        transform-origin: 7.5px 10px;
        animation: reach-lid 3s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      /* Whole crab leaves the ground: a small jump, then a higher one */
      @keyframes reach-hop {
        0%, 9% { transform: translate(0, 0); }
        11% { transform: translate(0, -2.2px); }
        14% { transform: translate(0, -3.8px); }
        16% { transform: translate(0, -4.2px); }
        18% { transform: translate(0, -3.8px); }
        21% { transform: translate(0, -1px); }
        23%, 31% { transform: translate(0, 0); }
        33% { transform: translate(0, -3.5px); }
        36% { transform: translate(0, -6.4px); }
        38% { transform: translate(0, -7px); }
        40% { transform: translate(0, -6.9px); }
        42% { transform: translate(0, -6.2px); }
        45.5% { transform: translate(0, -1.6px); }
        47.5% { transform: translate(0, 0); }
        50% { transform: translate(0, -0.6px); }
        53%, 100% { transform: translate(0, 0); }
      }

      /* Crouch, stretch tall on the way up, squash on landing, settle.
         Then inhale, "hmph" (squash) and keep the cheeks a bit puffed. */
      @keyframes reach-body {
        0%, 5% { transform: translate(0, 0) scale(1, 1); }
        9% { transform: translate(0, 0.8px) scale(1.08, 0.9); }
        11% { transform: translate(0, -0.3px) scale(0.92, 1.1); }
        16% { transform: translate(0, -0.2px) scale(0.95, 1.07); }
        21% { transform: translate(0, -0.2px) scale(0.96, 1.06); }
        23% { transform: translate(0, 0.6px) scale(1.12, 0.88); }
        26% { transform: translate(0, -0.1px) scale(0.98, 1.03); }
        28% { transform: translate(0, 0) scale(1, 1); }
        31% { transform: translate(0, 1px) scale(1.12, 0.85); }
        33% { transform: translate(0, -0.5px) scale(0.88, 1.16); }
        36% { transform: translate(0, -0.6px) scale(0.86, 1.2); }
        38% { transform: translate(0, -0.6px) scale(0.87, 1.19); }
        42% { transform: translate(0, -0.4px) scale(0.9, 1.14); }
        45.5% { transform: translate(0, -0.2px) scale(0.94, 1.08); }
        47.5% { transform: translate(0, 1px) scale(1.18, 0.82); }
        50% { transform: translate(0, -0.2px) scale(0.96, 1.05); }
        53%, 57% { transform: translate(0, 0) scale(1, 1); }
        61% { transform: translate(0, -0.3px) scale(0.97, 1.04); }
        64% { transform: translate(0.5px, 0.4px) scale(1.07, 0.93); }
        67% { transform: translate(0.5px, 0) scale(1.03, 0.98); }
        80% { transform: translate(0.5px, 0) scale(1.03, 0.98); }
        82% { transform: translate(0.5px, 0.3px) scale(1.06, 0.95); }
        85% { transform: translate(0.5px, 0) scale(1.03, 0.98); }
        90% { transform: translate(0.2px, 0) scale(1, 1); }
        94%, 100% { transform: translate(0, 0) scale(1, 1); }
      }

      @keyframes reach-legs-crouch {
        0%, 5%, 11%, 21%, 26%, 29%, 33%, 45.5%, 50%, 100% { transform: scaleY(1); }
        9% { transform: scaleY(0.75); }
        23% { transform: scaleY(0.8); }
        31% { transform: scaleY(0.7); }
        47.5% { transform: scaleY(0.7); }
      }

      /* Little legs dangle a touch longer while airborne */
      @keyframes reach-legs-dangle {
        0%, 10%, 22%, 32%, 47%, 100% { transform: scaleY(1); }
        14%, 18% { transform: scaleY(1.15); }
        36%, 42% { transform: scaleY(1.2); }
      }

      @keyframes reach-shadow {
        0%, 9%, 23%, 31%, 53%, 100% { transform: scaleX(1) translate(0, 0); opacity: 0.5; }
        16% { transform: scaleX(0.66) translate(0, 0); opacity: 0.3; }
        21% { transform: scaleX(0.92) translate(0, 0); opacity: 0.45; }
        38%, 40% { transform: scaleX(0.5) translate(0, 0); opacity: 0.2; }
        45.5% { transform: scaleX(0.85) translate(0, 0); opacity: 0.42; }
        47.5% { transform: scaleX(1.14) translate(0, 0); opacity: 0.55; }
        64%, 85% { transform: scaleX(1.04) translate(0.5px, 0); opacity: 0.5; }
      }

      /* Arms swing up to reach; second jump the right arm stretches higher
         and both tremble at the top. Then they fold in for the crossed pose. */
      @keyframes reach-arm-l {
        0%, 5% { transform: translate(0, 0) scale(1, 1); }
        9% { transform: translate(0, 0.5px) scale(1, 1); }
        12% { transform: translate(1px, -4.6px) scale(1, 2); }
        16% { transform: translate(1px, -4.6px) scale(1, 2.1); }
        19% { transform: translate(1px, -4.6px) scale(1, 2); }
        23% { transform: translate(0, 0) scale(1, 1); }
        31% { transform: translate(0, 0.5px) scale(1, 1); }
        34% { transform: translate(1px, -4.6px) scale(1, 2.2); }
        37% { transform: translate(1.2px, -4.6px) scale(1, 2.3); }
        38.5% { transform: translate(0.8px, -4.6px) scale(1, 2.3); }
        40% { transform: translate(1.2px, -4.6px) scale(1, 2.3); }
        41.5% { transform: translate(0.8px, -4.6px) scale(1, 2.3); }
        43% { transform: translate(1px, -4.6px) scale(1, 2.2); }
        46% { transform: translate(0.6px, -3px) scale(1, 1.7); }
        49% { transform: translate(-0.3px, 0.4px) scale(1, 1); }
        53%, 61% { transform: translate(0, 0) scale(1, 1); }
        64%, 88% { transform: translate(2px, 0) scale(1, 1); }
        93%, 100% { transform: translate(0, 0) scale(1, 1); }
      }

      @keyframes reach-arm-r {
        0%, 5% { transform: translate(0, 0) scale(1, 1); }
        9% { transform: translate(0, 0.5px) scale(1, 1); }
        12% { transform: translate(-1px, -4.6px) scale(1, 2); }
        16% { transform: translate(-1px, -4.6px) scale(1, 2.3); }
        19% { transform: translate(-1px, -4.6px) scale(1, 2); }
        23% { transform: translate(0, 0) scale(1, 1); }
        31% { transform: translate(0, 0.5px) scale(1, 1); }
        34% { transform: translate(-1px, -4.6px) scale(1, 2.6); }
        37% { transform: translate(-1.2px, -4.6px) scale(1, 3); }
        38.5% { transform: translate(-0.8px, -4.6px) scale(1, 3.1); }
        40% { transform: translate(-1.2px, -4.6px) scale(1, 3); }
        41.5% { transform: translate(-0.8px, -4.6px) scale(1, 3.1); }
        43% { transform: translate(-1px, -4.6px) scale(1, 2.7); }
        46% { transform: translate(-0.6px, -3px) scale(1, 1.7); }
        49% { transform: translate(0.3px, 0.4px) scale(1, 1); }
        53%, 61% { transform: translate(0, 0) scale(1, 1); }
        64%, 88% { transform: translate(-2px, 0) scale(1, 1); }
        93%, 100% { transform: translate(0, 0) scale(1, 1); }
      }

      @keyframes reach-pout {
        0%, 61%, 92%, 100% { opacity: 0; }
        64%, 88% { opacity: 1; }
      }

      /* Eyes fixed up on the target; after the miss, look away (sulk),
         one sulky glance back up, look away again */
      @keyframes reach-look {
        0% { transform: translate(0, 0); }
        5%, 47% { transform: translate(0, -1px); }
        50% { transform: translate(0, 0); }
        55%, 60% { transform: translate(-0.5px, -1px); }
        65%, 73% { transform: translate(1px, 0); }
        76%, 80% { transform: translate(-0.5px, -0.5px); }
        83%, 88% { transform: translate(1px, 0); }
        94%, 100% { transform: translate(0, 0); }
      }

      /* Blink on the hard landing; narrowed pouty eyes; open again */
      @keyframes reach-lid {
        0%, 25.5%, 27.5%, 46.5%, 51%, 61%, 92%, 100% { transform: scaleY(1); }
        26.5% { transform: scaleY(0.1); }
        48% { transform: scaleY(0.1); }
        64%, 74% { transform: scaleY(0.5); }
        76%, 79% { transform: scaleY(0.7); }
        81%, 88% { transform: scaleY(0.5); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <g class="hop">
    <!-- Legs -->
    <g class="legs-crouch">
      <g class="legs-dangle">
        <g id="legs" fill="#DE886D">
          <rect x="3" y="12" width="1" height="3"/>
          <rect x="5" y="12" width="1" height="3"/>
          <rect x="9" y="12" width="1" height="3"/>
          <rect x="11" y="12" width="1" height="3"/>
        </g>
      </g>
    </g>

    <!-- Animated Upper Body -->
    <g class="action-body">
      <!-- Torso -->
      <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <!-- Left Arm -->
      <g class="arm-l">
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Right Arm -->
      <g class="arm-r">
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Crossed arms in front of the torso (pout) -->
      <g class="arms-crossed" fill="#A85A3A">
        <rect x="3" y="10" width="9" height="1"/>
        <rect x="3" y="11" width="2" height="1"/>
        <rect x="10" y="11" width="2" height="1"/>
      </g>
      <g class="eyes-look">
        <!-- Small inward brows (pout) -->
        <g class="brows" fill="#000000">
          <rect x="3" y="6.5" width="1" height="1"/>
          <rect x="4" y="7" width="1" height="1"/>
          <rect x="11" y="6.5" width="1" height="1"/>
          <rect x="10" y="7" width="1" height="1"/>
        </g>
        <!-- Eyes (lids close from the top) -->
        <g class="eyes-lid" fill="#000000">
          <rect x="4" y="8" width="1" height="2"/>
          <rect x="10" y="8" width="1" height="2"/>
        </g>
      </g>
    </g>
  </g>
</svg>
