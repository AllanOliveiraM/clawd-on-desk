<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* 1.8-Second Loop — Pounce strike (left): eyes lock on something to
         the left, he lowers himself and wiggles his rear like a cat (back
         feet kneading, faster and faster), freezes, pulls back a hair, then
         STRIKES: the whole body leans far forward from the feet and the left
         claw shoots out long (tip at about u = -9.0, v = 9.6; nothing
         crosses u = -9.5), pats the spot twice, pulls back with a little recoil and
         settles. The feet never leave their spot: all the reach is lean and
         arm stretch. */
      .body-lean {
        transform-origin: 7.5px 15px;
        animation: ps-lean 1.8s infinite ease-in-out;
      }

      .body-squash {
        transform-origin: 7.5px 13px;
        animation: ps-squash 1.8s infinite ease-in-out;
      }

      .legs-squash {
        transform-origin: 7.5px 15px;
        animation: ps-legs 1.8s infinite ease-in-out;
      }

      .leg-1 { animation: ps-leg-1 1.8s infinite ease-in-out; }
      .leg-2 { animation: ps-leg-2 1.8s infinite ease-in-out; }
      .leg-3 { animation: ps-leg-3 1.8s infinite ease-in-out; }
      .leg-4 { animation: ps-leg-4 1.8s infinite ease-in-out; }

      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: ps-shadow 1.8s infinite ease-in-out;
      }

      .arm-l {
        transform-origin: 2px 10px;
        animation: ps-arm-l 1.8s infinite ease-in-out;
      }

      .arm-r {
        transform-origin: 13px 10px;
        animation: ps-arm-r 1.8s infinite ease-in-out;
      }

      .eyes-look {
        animation: ps-look 1.8s infinite ease-in-out;
      }

      .eyes-blink {
        transform-origin: 7.5px 9.5px;
        animation: ps-blink 1.8s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      /* Lower and lean towards the target; the rear sways side to side,
         faster each time; freeze; pull back; dive forward from the feet;
         hold through the pats; recoil; straighten */
      @keyframes ps-lean {
        0%, 4% { transform: translate(0, 0) rotate(0deg); }
        12% { transform: translate(-0.5px, 1.5px) rotate(-4deg); }
        16% { transform: translate(-0.2px, 1.5px) rotate(-2deg); }
        20% { transform: translate(-0.8px, 1.5px) rotate(-7deg); }
        24% { transform: translate(-0.2px, 1.5px) rotate(-2deg); }
        27.5% { transform: translate(-0.8px, 1.5px) rotate(-7deg); }
        31% { transform: translate(-0.2px, 1.5px) rotate(-2deg); }
        34% { transform: translate(-0.8px, 1.5px) rotate(-7deg); }
        37% { transform: translate(-0.2px, 1.5px) rotate(-2deg); }
        39.5% { transform: translate(-0.8px, 1.5px) rotate(-7deg); }
        42% { transform: translate(-0.2px, 1.5px) rotate(-2deg); }
        44% { transform: translate(-0.5px, 1.7px) rotate(-4deg); }
        49% { transform: translate(0.6px, 1.9px) rotate(2deg); }
        53% { transform: translate(-1.2px, -1.2px) rotate(-13deg); }
        57%, 72% { transform: translate(-1.15px, -1.15px) rotate(-12.5deg); }
        75% { transform: translate(-0.5px, -0.4px) rotate(-5deg); }
        78% { transform: translate(0.3px, 0.3px) rotate(3deg); }
        83% { transform: translate(0, 0) rotate(-1deg); }
        88%, 100% { transform: translate(0, 0) rotate(0deg); }
      }

      @keyframes ps-squash {
        0%, 4% { transform: scale(1, 1); }
        12%, 44% { transform: scale(1.1, 0.86); }
        49% { transform: scale(1.15, 0.8); }
        53%, 72% { transform: scale(1.05, 0.95); }
        78% { transform: scale(0.95, 1.06); }
        83% { transform: scale(1.03, 0.97); }
        88%, 100% { transform: scale(1, 1); }
      }

      /* Legs fold in the crouch, push long on the strike (feet planted) */
      @keyframes ps-legs {
        0%, 4% { transform: scale(1, 1); }
        12%, 49% { transform: scale(1, 0.67); }
        53%, 72% { transform: scale(1, 1.36); }
        78% { transform: scale(1, 0.85); }
        84%, 100% { transform: scale(1, 1); }
      }

      /* Front feet stay planted; back feet knead during the wiggle and the
         rearmost one kicks up as he dives forward */
      @keyframes ps-leg-1 {
        0%, 100% { transform: translate(0, 0); }
      }

      @keyframes ps-leg-2 {
        0%, 100% { transform: translate(0, 0); }
      }

      @keyframes ps-leg-3 {
        0%, 16%, 20%, 24%, 27.5%, 31%, 34%, 37%, 39.5%, 42%, 100% { transform: translate(0, 0); }
        18%, 25.8%, 32.5%, 38.2%, 40.8% { transform: translate(0, -1px); }
      }

      @keyframes ps-leg-4 {
        0%, 18%, 24%, 25.8%, 31%, 32.5%, 37%, 38.2%, 40.8%, 44%, 100% { transform: translate(0, 0); }
        21%, 29%, 35.5%, 39%, 41.5% { transform: translate(0, -1px); }
      }

      @keyframes ps-shadow {
        0%, 4%, 88%, 100% { transform: translateX(0) scaleX(1); opacity: 0.5; }
        12%, 49% { transform: translateX(0) scaleX(1.12); opacity: 0.55; }
        53%, 72% { transform: translateX(-1px) scaleX(1.2); opacity: 0.55; }
        78% { transform: translateX(0) scaleX(1.05); opacity: 0.52; }
      }

      /* Front claw: ready low, cocked back on the pull-back, shoots out long
         and level on the strike (counter-rotated against the lean), pats
         the spot twice, retracts with the recoil */
      @keyframes ps-arm-l {
        0%, 4% { transform: rotate(0deg) scale(1, 1); }
        12%, 44% { transform: rotate(-15deg) scale(1.2, 1); }
        49% { transform: rotate(-30deg) scale(0.9, 1); }
        53% { transform: rotate(20deg) scale(4.15, 0.9); }
        57% { transform: rotate(20deg) scale(4.1, 0.9); }
        60% { transform: rotate(11deg) scale(4.05, 0.9); }
        63% { transform: rotate(20deg) scale(4.1, 0.9); }
        66% { transform: rotate(11deg) scale(4.05, 0.9); }
        69%, 72% { transform: rotate(20deg) scale(4.1, 0.9); }
        75% { transform: rotate(12deg) scale(2.6, 0.95); }
        78% { transform: rotate(-10deg) scale(1.3, 1); }
        84% { transform: rotate(5deg) scale(1, 1); }
        90%, 100% { transform: rotate(0deg) scale(1, 1); }
      }

      /* Back claw: braces up and back as a counterweight on the strike */
      @keyframes ps-arm-r {
        0%, 4% { transform: rotate(0deg) scale(1, 1); }
        12%, 44% { transform: rotate(10deg) scale(1, 1); }
        49% { transform: rotate(20deg) scale(1, 1); }
        53% { transform: rotate(-50deg) scale(1.4, 1); }
        57%, 72% { transform: rotate(-35deg) scale(1.2, 1); }
        78% { transform: rotate(10deg) scale(1, 1); }
        86%, 100% { transform: rotate(0deg) scale(1, 1); }
      }

      /* Eyes lock on the target through the wiggle, stay on the claw while
         it pats, then come home */
      @keyframes ps-look {
        0% { transform: translate(0, 0); }
        5%, 44% { transform: translate(-1.5px, 0.5px); }
        49% { transform: translate(-1.8px, 0.5px); }
        53%, 57% { transform: translate(-1.8px, 0); }
        60%, 72% { transform: translate(-1.6px, 0.5px); }
        80%, 100% { transform: translate(0, 0); }
      }

      /* Focused low lids, narrow at the freeze, wide on the strike, double
         blink while settling */
      @keyframes ps-blink {
        0%, 4% { transform: scaleY(1); }
        10%, 42% { transform: scaleY(0.7); }
        46%, 49% { transform: scaleY(0.5); }
        52%, 58% { transform: scaleY(1.2); }
        62%, 84% { transform: scaleY(1); }
        86% { transform: scaleY(0.1); }
        88% { transform: scaleY(1); }
        90% { transform: scaleY(0.1); }
        92%, 100% { transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs -->
  <g class="legs-squash">
    <g id="legs" fill="#DE886D">
      <g class="leg-1"><rect x="3" y="12" width="1" height="3"/></g>
      <g class="leg-2"><rect x="5" y="12" width="1" height="3"/></g>
      <g class="leg-3"><rect x="9" y="12" width="1" height="3"/></g>
      <g class="leg-4"><rect x="11" y="12" width="1" height="3"/></g>
    </g>
  </g>

  <!-- Animated Upper Body -->
  <g class="body-lean">
    <g class="body-squash">
      <!-- Torso -->
      <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <!-- Left Arm (front, strikes out long) -->
      <g class="arm-l">
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Right Arm -->
      <g class="arm-r">
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Eyes -->
      <g class="eyes-look">
        <g class="eyes-blink" fill="#000000">
          <rect x="4" y="8" width="1" height="2"/>
          <rect x="10" y="8" width="1" height="2"/>
        </g>
      </g>
    </g>
  </g>
</svg>
