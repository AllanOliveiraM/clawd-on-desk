<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* Exact mirror of the -left file (whole art flipped around x = 7.5).
         Notes below describe the unflipped art: its left is the on-screen
         right, and an art u maps to 15 - u on screen.
         2.2-Second Loop — Catch (miss, left): same side swipe as the left
         catch (claw out to about u = -1 at v = 10), but the claw snaps shut
         on nothing; eyes dart after it, he lunges for it again, loses his
         balance (wobble, feet shuffling, arms windmilling), plops down on his
         bottom with a bounce, shakes his head, looks away embarrassed with a
         double blink, scratches his head and stands back up. */
      .body-jump {
        animation: ml-jump 2.2s infinite ease-in-out;
      }

      .body-lean {
        transform-origin: 7.5px 15px;
        animation: ml-lean 2.2s infinite ease-in-out;
      }

      .body-squash {
        transform-origin: 7.5px 13px;
        animation: ml-squash 2.2s infinite ease-in-out;
      }

      .legs-jump {
        transform-origin: 7.5px 15px;
        animation: ml-legs 2.2s infinite ease-in-out;
      }

      .leg-1 { animation: ml-leg-1 2.2s infinite ease-in-out; }
      .leg-2 { animation: ml-leg-2 2.2s infinite ease-in-out; }
      .leg-3 { animation: ml-leg-3 2.2s infinite ease-in-out; }
      .leg-4 { animation: ml-leg-4 2.2s infinite ease-in-out; }

      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: ml-shadow 2.2s infinite ease-in-out;
      }

      .arm-l {
        transform-origin: 2px 10px;
        animation: ml-arm-l 2.2s infinite ease-in-out;
      }

      .claw-l {
        transform-origin: 2px 10px;
        animation: ml-claw-l 2.2s infinite ease-in-out;
      }

      .arm-r {
        transform-origin: 13px 10px;
        animation: ml-arm-r 2.2s infinite ease-in-out;
      }

      .eyes-look {
        animation: ml-look 2.2s infinite ease-in-out;
      }

      .eyes-blink {
        transform-origin: 7.5px 9px;
        animation: ml-blink 2.2s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      /* Stays on the ground for the swipe, plops down onto his bottom,
         bounces, sits, then stands back up */
      @keyframes ml-jump {
        0%, 29.5% { transform: translate(0, 0); }
        32% { transform: translate(0, -0.7px); }
        35% { transform: translate(0, 2.4px); }
        39% { transform: translate(0, -1.1px); }
        43% { transform: translate(0, 2.2px); }
        46%, 84% { transform: translate(0, 2px); }
        91% { transform: translate(0, -0.5px); }
        96%, 100% { transform: translate(0, 0); }
      }

      /* Wind-up away, swipe, lunge again further, teeter back and forth,
         straighten as he sits; head shake; lean away (embarrassed) */
      @keyframes ml-lean {
        0%, 4% { transform: translate(0, 0) rotate(0deg); }
        9%, 11% { transform: translate(0.6px, 0.4px) rotate(4deg); }
        14.5% { transform: translate(-0.35px, 0.1px) rotate(-3.5deg); }
        17% { transform: translate(-0.3px, 0.1px) rotate(-3deg); }
        21% { transform: translate(-0.5px, -0.3px) rotate(-7deg); }
        24.5% { transform: translate(0.3px, 0) rotate(5deg); }
        27.5% { transform: translate(-0.3px, 0) rotate(-5deg); }
        30.5% { transform: translate(0.2px, 0) rotate(3deg); }
        34%, 46% { transform: translate(0, 0) rotate(0deg); }
        48.5% { transform: translate(0, 0) rotate(4deg); }
        51.5% { transform: translate(0, 0) rotate(-4deg); }
        54.5% { transform: translate(0, 0) rotate(3.5deg); }
        57.5% { transform: translate(0, 0) rotate(-3deg); }
        60.5% { transform: translate(0, 0) rotate(1.5deg); }
        63% { transform: translate(0, 0) rotate(0deg); }
        67%, 80% { transform: translate(0, 0) rotate(2.5deg); }
        88%, 100% { transform: translate(0, 0) rotate(0deg); }
      }

      @keyframes ml-squash {
        0%, 4% { transform: scale(1, 1); }
        9%, 11% { transform: scale(1.06, 0.92); }
        14.5% { transform: scale(1.08, 0.95); }
        21% { transform: scale(0.96, 1.05); }
        30.5% { transform: scale(1, 1); }
        33% { transform: scale(0.92, 1.1); }
        35% { transform: scale(1.2, 0.78); }
        39% { transform: scale(0.95, 1.06); }
        43% { transform: scale(1.12, 0.85); }
        47% { transform: scale(1.04, 0.96); }
        80%, 84% { transform: scale(1.02, 0.95); }
        91% { transform: scale(0.96, 1.05); }
        96%, 100% { transform: scale(1, 1); }
      }

      /* Legs fold under him when he sits, dangle during the bounce */
      @keyframes ml-legs {
        0%, 4% { transform: translate(0, 0) scale(1, 1); }
        9%, 11% { transform: translate(0, 0) scale(1, 0.8); }
        14.5%, 29.5% { transform: translate(0, 0) scale(1, 1); }
        32% { transform: translate(0, -0.5px) scale(1, 1.05); }
        35% { transform: translate(0, 0) scale(1, 0.34); }
        39% { transform: translate(0, -1.1px) scale(1, 0.9); }
        43%, 84% { transform: translate(0, 0) scale(1, 0.34); }
        91% { transform: translate(0, 0) scale(1, 1.08); }
        96%, 100% { transform: translate(0, 0) scale(1, 1); }
      }

      /* Feet: weight shift on the swipe, frantic shuffle while teetering */
      @keyframes ml-leg-1 {
        0%, 9%, 13%, 19%, 23%, 26%, 29%, 32%, 100% { transform: translate(0, 0); }
        11%, 21%, 27.5% { transform: translate(0, -1px); }
      }

      @keyframes ml-leg-2 {
        0%, 23%, 26%, 29%, 32%, 100% { transform: translate(0, 0); }
        24.5%, 30.5% { transform: translate(0, -1px); }
      }

      @keyframes ml-leg-3 {
        0%, 20%, 23%, 26%, 29%, 32%, 100% { transform: translate(0, 0); }
        21.5%, 27.5% { transform: translate(0, -1px); }
      }

      @keyframes ml-leg-4 {
        0%, 12%, 16%, 23%, 26%, 29%, 32%, 100% { transform: translate(0, 0); }
        14.5%, 24.5%, 30.5% { transform: translate(0, -1px); }
      }

      @keyframes ml-shadow {
        0%, 4%, 100% { transform: translateX(0) scaleX(1); opacity: 0.5; }
        9%, 11% { transform: translateX(0.3px) scaleX(1.06); opacity: 0.52; }
        14.5%, 21% { transform: translateX(-0.5px) scaleX(1.1); opacity: 0.55; }
        30.5% { transform: translateX(0) scaleX(1); opacity: 0.5; }
        35% { transform: translateX(0) scaleX(1.24); opacity: 0.6; }
        39% { transform: translateX(0) scaleX(0.9); opacity: 0.45; }
        43% { transform: translateX(0) scaleX(1.18); opacity: 0.58; }
        47%, 84% { transform: translateX(0) scaleX(1.1); opacity: 0.55; }
        91% { transform: translateX(0) scaleX(0.97); opacity: 0.5; }
      }

      /* Left claw: wind-up, swipe out (tip at u = -1, v = 10), snaps shut
         on nothing, a second grab up after it, windmills, flops down */
      @keyframes ml-arm-l {
        0%, 4% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        9%, 11% { transform: translate(0, 0) rotate(35deg) scale(0.8, 1); }
        14.5% { transform: translate(0, 0) rotate(5deg) scale(1.15, 1); }
        17% { transform: translate(0, 0) rotate(4deg) scale(1.08, 1); }
        21% { transform: translate(0, 0) rotate(30deg) scale(1.15, 1); }
        24.5% { transform: translate(0, 0) rotate(70deg) scale(1, 1); }
        27.5% { transform: translate(0, 0) rotate(-25deg) scale(1, 1); }
        30.5% { transform: translate(0, 0) rotate(50deg) scale(1, 1); }
        35% { transform: translate(-0.5px, 0) rotate(-40deg) scale(1, 1); }
        39% { transform: translate(0, -1px) rotate(25deg) scale(1, 1); }
        43% { transform: translate(0, 0.5px) rotate(-10deg) scale(1, 1); }
        47%, 90% { transform: translate(0, 0.5px) rotate(0deg) scale(1, 1); }
        96%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
      }

      /* Pinch notch at the tip: the claw clacks shut twice on thin air */
      @keyframes ml-claw-l {
        0%, 14% { opacity: 0; }
        15%, 17.5% { opacity: 1; }
        18%, 20.5% { opacity: 0; }
        21%, 22.5% { opacity: 1; }
        23%, 100% { opacity: 0; }
      }

      /* Other arm: braces on the swipe, windmills while teetering, flops,
         then goes up to scratch the side of his head */
      @keyframes ml-arm-r {
        0%, 4% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        9%, 11% { transform: translate(0, 0) rotate(-12deg) scale(1, 1); }
        14.5%, 17% { transform: translate(0, 0) rotate(-35deg) scale(1, 1); }
        21% { transform: translate(0, 0) rotate(-10deg) scale(1, 1); }
        24.5% { transform: translate(0, 0) rotate(-70deg) scale(1, 1); }
        27.5% { transform: translate(0, 0) rotate(30deg) scale(1, 1); }
        30.5% { transform: translate(0, 0) rotate(-55deg) scale(1, 1); }
        35% { transform: translate(0.5px, 0) rotate(40deg) scale(1, 1); }
        39% { transform: translate(0, -1px) rotate(-25deg) scale(1, 1); }
        43% { transform: translate(0, 0.5px) rotate(10deg) scale(1, 1); }
        47%, 64% { transform: translate(0, 0.5px) rotate(0deg) scale(1, 1); }
        67% { transform: translate(-0.5px, -3px) rotate(-12deg) scale(1, 2.2); }
        69% { transform: translate(-0.5px, -3.3px) rotate(4deg) scale(1, 2.2); }
        71% { transform: translate(-0.5px, -3px) rotate(-12deg) scale(1, 2.2); }
        73% { transform: translate(-0.5px, -3.3px) rotate(4deg) scale(1, 2.2); }
        75% { transform: translate(-0.5px, -3px) rotate(-12deg) scale(1, 2.2); }
        77% { transform: translate(-0.5px, -3.3px) rotate(-6deg) scale(1, 2.2); }
        82% { transform: translate(0, 0.5px) rotate(0deg) scale(1, 1); }
        90% { transform: translate(0, 0.5px) rotate(0deg) scale(1, 1); }
        96%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
      }

      /* Eyes snap left, follow the claw, dart up-left as it gets away,
         wobble with the head shake, look away (right), come home */
      @keyframes ml-look {
        0%, 2% { transform: translate(0, 0); }
        6%, 17% { transform: translate(-1.5px, 0); }
        19%, 23% { transform: translate(-2px, -1.2px); }
        27% { transform: translate(-1px, -0.5px); }
        31% { transform: translate(0, 0); }
        46%, 47% { transform: translate(0, 0); }
        48.5% { transform: translate(1px, 0); }
        51.5% { transform: translate(-1px, 0); }
        54.5% { transform: translate(1px, 0); }
        57.5% { transform: translate(-1px, 0); }
        60.5% { transform: translate(0.5px, 0); }
        63% { transform: translate(0, 0); }
        66%, 82% { transform: translate(1.5px, 0.5px); }
        90%, 100% { transform: translate(0, 0); }
      }

      /* Squint on the wind-up, wide on the swipe, wider when it escapes,
         squeeze on the bump, droopy while sitting, double blink */
      @keyframes ml-blink {
        0%, 4% { transform: scaleY(1); }
        8%, 11% { transform: scaleY(0.6); }
        14%, 17% { transform: scaleY(1.2); }
        19%, 26% { transform: scaleY(1.3); }
        32% { transform: scaleY(1); }
        34% { transform: scaleY(0.1); }
        38% { transform: scaleY(1); }
        46%, 64% { transform: scaleY(0.75); }
        67% { transform: scaleY(1); }
        70% { transform: scaleY(0.1); }
        72% { transform: scaleY(1); }
        74% { transform: scaleY(0.1); }
        76%, 100% { transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- Mirrored: everything below is the -left art flipped horizontally -->
  <g transform="translate(15 0) scale(-1 1)">

    <!-- Ground Shadow -->
    <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

    <!-- Legs (shuffle while teetering, fold when sitting) -->
    <g class="legs-jump">
      <g id="legs" fill="#DE886D">
        <g class="leg-1"><rect x="3" y="12" width="1" height="3"/></g>
        <g class="leg-2"><rect x="5" y="12" width="1" height="3"/></g>
        <g class="leg-3"><rect x="9" y="12" width="1" height="3"/></g>
        <g class="leg-4"><rect x="11" y="12" width="1" height="3"/></g>
      </g>
    </g>

    <!-- Animated Upper Body -->
    <g class="body-jump">
      <g class="body-lean">
        <g class="body-squash">
          <!-- Torso -->
          <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
          <!-- Left Arm (swipes out) -->
          <g class="arm-l">
            <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
            <!-- Pinch notch at the claw tip, only when it snaps -->
            <g class="claw-l">
              <rect x="0" y="9.8" width="0.5" height="0.4" fill="#000000" opacity="0.35"/>
            </g>
          </g>
          <!-- Right Arm -->
          <g class="arm-r">
            <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
          </g>
          <!-- Eyes -->
          <g class="eyes-look">
            <g class="eyes-blink" fill="#000000">
              <rect x="4" y="8" width="1" height="2"/>
              <rect x="10" y="8" width="1" height="2"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
