<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* Walk, tired: replaces the roam walk visual while the window moves.
         0.3 s one-shot intro (wrapper groups, forwards) sags out of the
         neutral rest pose of clawd-idle-follow.svg: body sinks a little and
         leans forward, arms hang lower, eyes go half-closed and drop to the
         floor ahead. Then the stride loops on the inner groups (delay
         0.3 s): 4 s loop, same step cadence as clawd-mini-crabwalk.svg (each
         leg pair steps once every 0.5 s) but the feet barely lift: a low
         shuffle forward and a short drag back. Heavy little dip on every
         footfall, arms swing loosely, one long slow blink with a sleepy nod
         (sinks, then catches himself). Every loop starts at its rest value
         and the whole pose stays within 1 unit / 2 deg of the rest pose, so
         the walk can be cut at any moment.
         Faces right (the walk direction); the app mirrors it for left. */
      .intro-droop {
        transform-origin: 7.5px 13px;
        animation: tw-intro-droop 0.3s ease-in-out forwards;
      }
      .intro-arm {
        animation: tw-intro-arm 0.3s ease-in-out forwards;
      }
      .intro-eyes {
        animation: tw-intro-eyes 0.3s ease-in-out forwards;
      }
      .intro-lid {
        transform-origin: 7.5px 10px;
        animation: tw-intro-lid 0.3s ease-in-out forwards;
      }
      .plod {
        animation: tw-plod 0.25s 0.3s infinite ease-in-out;
      }
      .nod {
        transform-origin: 7.5px 13px;
        animation: tw-nod 4s 0.3s infinite ease-in-out;
      }
      .leg-1 { animation: tw-drag-1 0.5s 0.3s infinite ease-in-out; transform-origin: top center; transform-box: fill-box; }
      .leg-2 { animation: tw-drag-2 0.5s 0.3s infinite ease-in-out; transform-origin: top center; transform-box: fill-box; }
      .arm-l {
        transform-origin: 1.5px 9.5px;
        animation: tw-arm-l 0.5s 0.3s infinite ease-in-out;
      }
      .arm-r {
        transform-origin: 13.5px 9.5px;
        animation: tw-arm-r 0.5s 0.3s infinite ease-in-out;
      }
      .eyes-look {
        animation: tw-look 4s 0.3s infinite ease-in-out;
      }
      .eyes-lid {
        transform-origin: 7.5px 10px;
        animation: tw-lid 4s 0.3s infinite ease-in-out;
      }

      /* --- Intro (one-shot): sag into the tired pose --- */
      @keyframes tw-intro-droop {
        0% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        100% { transform: translate(0, 0.3px) rotate(1deg) scale(1.02, 0.95); }
      }
      @keyframes tw-intro-arm {
        0% { transform: translate(0, 0); }
        100% { transform: translate(0, 0.6px); }
      }
      @keyframes tw-intro-eyes {
        0% { transform: translate(0, 0); }
        100% { transform: translate(1px, 0.5px); }
      }
      @keyframes tw-intro-lid {
        0% { transform: scaleY(1); }
        100% { transform: scaleY(0.5); }
      }

      /* --- Stride (relative to the tired pose) --- */

      /* Heavy dip each time a foot lands (twice per leg cycle) */
      @keyframes tw-plod {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, 0.2px); }
      }

      /* Low shuffle forward, foot back down, short drag behind */
      @keyframes tw-drag-1 {
        0%, 50%, 100% { transform: rotate(0deg) scaleY(1); }
        12% { transform: rotate(-7deg) scaleY(0.9); }
        25% { transform: rotate(-11deg) scaleY(0.93); }
        38% { transform: rotate(-2deg) scaleY(1); }
        44% { transform: rotate(5deg) scaleY(1); }
      }
      @keyframes tw-drag-2 {
        0%, 50%, 100% { transform: rotate(0deg) scaleY(1); }
        62% { transform: rotate(-7deg) scaleY(0.9); }
        75% { transform: rotate(-11deg) scaleY(0.93); }
        88% { transform: rotate(-2deg) scaleY(1); }
        94% { transform: rotate(5deg) scaleY(1); }
      }

      /* The nod: sinks during the long blink, jolts up, settles */
      @keyframes tw-nod {
        0%, 40%, 82%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        52% { transform: translate(0.2px, 0.15px) rotate(0.5deg) scale(1.02, 0.98); }
        62% { transform: translate(0.2px, 0.2px) rotate(0.8deg) scale(1.01, 0.98); }
        66% { transform: translate(0, -0.3px) rotate(-0.8deg) scale(0.98, 1.04); }
        72% { transform: translate(0, -0.1px) rotate(-0.3deg) scale(0.99, 1.02); }
      }

      /* Arms swing loosely, opposite to each other */
      @keyframes tw-arm-l {
        0%, 50%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(9deg); }
        75% { transform: rotate(-7deg); }
      }
      @keyframes tw-arm-r {
        0%, 50%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(7deg); }
        75% { transform: rotate(-9deg); }
      }

      /* Eyes drop further while dozing off, flick up on the jolt */
      @keyframes tw-look {
        0%, 40%, 80%, 100% { transform: translate(0, 0); }
        62% { transform: translate(0, 0.5px); }
        66% { transform: translate(-0.5px, -0.5px); }
      }

      /* One long slow blink: lids droop shut, stay shut, pop open on the
         jolt, sink back to half-closed */
      @keyframes tw-lid {
        0%, 40%, 82%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.6); }
        54%, 63% { transform: scaleY(0.2); }
        66% { transform: scaleY(1.7); }
        72% { transform: scaleY(1.3); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect id="ground-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs: feet on the floor, shuffling -->
  <g id="legs" fill="#DE886D">
    <rect id="outer-left-leg" class="leg-1" x="3" y="13" width="1" height="2"/>
    <rect id="inner-left-leg" class="leg-2" x="5" y="13" width="1" height="2"/>
    <rect id="inner-right-leg" class="leg-1" x="9" y="13" width="1" height="2"/>
    <rect id="outer-right-leg" class="leg-2" x="11" y="13" width="1" height="2"/>
  </g>

  <!-- Upper Body -->
  <g class="intro-droop">
    <g class="plod">
      <g class="nod">
        <!-- Left Arm (dangling) -->
        <g class="intro-arm">
          <g class="arm-l">
            <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
          </g>
        </g>
        <!-- Right Arm (dangling) -->
        <g class="intro-arm">
          <g class="arm-r">
            <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
          </g>
        </g>
        <!-- Torso -->
        <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
        <!-- Eyes (lids close from the top) -->
        <g class="intro-eyes">
          <g class="eyes-look">
            <g class="intro-lid">
              <g class="eyes-lid" fill="#000000">
                <rect x="4" y="8" width="1" height="2"/>
                <rect x="10" y="8" width="1" height="2"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
