<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* 1.6-Second Loop — Catch (low): something scurries right at his feet.
         Eyes drop to it, he bows into a crouch with the arms swinging out
         low, then both arms dive down in front of him (darker, in front of
         the body) and the hands clap shut between his knees (clasp centre
         u 7.5, v 14). Happy "^^" bob while holding it, then lets go and
         stands back up. */
      .body-jump {
        animation: low-jump 1.6s infinite ease-in-out;
      }

      .body-squash {
        transform-origin: 7.5px 13px;
        animation: low-squash 1.6s infinite ease-in-out;
      }

      .legs-jump {
        transform-origin: 7.5px 15px;
        animation: low-legs 1.6s infinite ease-in-out;
      }

      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: low-shadow 1.6s infinite ease-in-out;
      }

      .arm-l {
        transform-origin: 1px 11px;
        animation: low-arm-l 1.6s infinite ease-in-out;
      }

      .arm-r {
        transform-origin: 14px 11px;
        animation: low-arm-r 1.6s infinite ease-in-out;
      }

      .clap {
        opacity: 0;
        animation: low-clap 1.6s infinite ease-in-out;
      }

      .fore-l {
        transform-origin: 1.5px 10.5px;
        animation: low-fore-l 1.6s infinite ease-in-out;
      }

      .fore-r {
        transform-origin: 13.5px 10.5px;
        animation: low-fore-r 1.6s infinite ease-in-out;
      }

      .fist-l {
        animation: low-fist-l 1.6s infinite ease-in-out;
      }

      .fist-r {
        animation: low-fist-r 1.6s infinite ease-in-out;
      }

      .eyes-look {
        animation: low-look 1.6s infinite ease-in-out;
      }

      .eyes-blink {
        transform-origin: 7.5px 9px;
        animation: low-blink 1.6s infinite ease-in-out;
      }

      .eyes-open {
        animation: low-eyes-open 1.6s infinite step-end;
      }

      .eyes-happy {
        opacity: 0;
        animation: low-eyes-happy 1.6s infinite step-end;
      }

      /* --- Keyframes --- */

      /* Bow down into the crouch, dip on the clap, bob while holding,
         stand back up */
      @keyframes low-jump {
        0%, 8% { transform: translate(0, 0); }
        20%, 24% { transform: translate(0, 0.9px); }
        30% { transform: translate(0, 0.8px); }
        33% { transform: translate(0, 0.6px); }
        44% { transform: translate(0, 0.3px); }
        52% { transform: translate(0, 0.6px); }
        62% { transform: translate(0, 0.3px); }
        72%, 82% { transform: translate(0, 0.6px); }
        92% { transform: translate(0, -0.3px); }
        97%, 100% { transform: translate(0, 0); }
      }

      @keyframes low-squash {
        0%, 8% { transform: scale(1, 1); }
        20%, 24% { transform: scale(1.08, 0.88); }
        30% { transform: scale(1.1, 0.88); }
        33% { transform: scale(1.06, 0.92); }
        44% { transform: scale(1.02, 0.96); }
        52% { transform: scale(1.06, 0.92); }
        62% { transform: scale(1.02, 0.96); }
        72%, 82% { transform: scale(1.06, 0.92); }
        92% { transform: scale(0.97, 1.04); }
        97%, 100% { transform: scale(1, 1); }
      }

      @keyframes low-legs {
        0%, 8% { transform: scale(1, 1); }
        20%, 30% { transform: scale(1, 0.75); }
        33%, 82% { transform: scale(1, 0.8); }
        92% { transform: scale(1, 1.04); }
        97%, 100% { transform: scale(1, 1); }
      }

      @keyframes low-shadow {
        0%, 8%, 97%, 100% { transform: scaleX(1); opacity: 0.5; }
        20%, 30% { transform: scaleX(1.1); opacity: 0.55; }
        33%, 82% { transform: scaleX(1.06); opacity: 0.53; }
        92% { transform: scaleX(0.97); opacity: 0.49; }
      }

      /* Side arms swing out low (wind-up), then tuck in behind the front
         arms; come back out to stand */
      @keyframes low-arm-l {
        0%, 8% { transform: translate(0, 0) rotate(0deg); }
        20%, 24% { transform: translate(0, 0.5px) rotate(-60deg); }
        28% { transform: translate(1px, 0.5px) rotate(0deg); }
        30%, 84% { transform: translate(2px, 0.5px) rotate(0deg); }
        92% { transform: translate(-0.3px, 0) rotate(0deg); }
        97%, 100% { transform: translate(0, 0) rotate(0deg); }
      }

      @keyframes low-arm-r {
        0%, 8% { transform: translate(0, 0) rotate(0deg); }
        20%, 24% { transform: translate(0, 0.5px) rotate(60deg); }
        28% { transform: translate(-1px, 0.5px) rotate(0deg); }
        30%, 84% { transform: translate(-2px, 0.5px) rotate(0deg); }
        92% { transform: translate(0.3px, 0) rotate(0deg); }
        97%, 100% { transform: translate(0, 0) rotate(0deg); }
      }

      @keyframes low-clap {
        0%, 24% { opacity: 0; }
        25%, 87% { opacity: 1; }
        88%, 100% { opacity: 0; }
      }

      /* Front arms: reach length s goes 0.45 (hands apart) to 1 (clap);
         fists follow the same s so they stay on the forearm tips:
         fist offset = (s - 1) * (5, 2.93) */
      @keyframes low-fore-l {
        0%, 25% { transform: rotate(30.4deg) scale(0.45, 1); }
        30% { transform: rotate(30.4deg) scale(1.04, 1); }
        33%, 63% { transform: rotate(30.4deg) scale(1, 1); }
        66% { transform: rotate(30.4deg) scale(1.03, 1); }
        69%, 82% { transform: rotate(30.4deg) scale(1, 1); }
        87%, 100% { transform: rotate(30.4deg) scale(0.45, 1); }
      }

      @keyframes low-fore-r {
        0%, 25% { transform: rotate(-30.4deg) scale(0.45, 1); }
        30% { transform: rotate(-30.4deg) scale(1.04, 1); }
        33%, 63% { transform: rotate(-30.4deg) scale(1, 1); }
        66% { transform: rotate(-30.4deg) scale(1.03, 1); }
        69%, 82% { transform: rotate(-30.4deg) scale(1, 1); }
        87%, 100% { transform: rotate(-30.4deg) scale(0.45, 1); }
      }

      @keyframes low-fist-l {
        0%, 25% { transform: translate(-2.75px, -1.61px); }
        30% { transform: translate(0.2px, 0.12px); }
        33%, 63% { transform: translate(0, 0); }
        66% { transform: translate(0.15px, 0.09px); }
        69%, 82% { transform: translate(0, 0); }
        87%, 100% { transform: translate(-2.75px, -1.61px); }
      }

      @keyframes low-fist-r {
        0%, 25% { transform: translate(2.75px, -1.61px); }
        30% { transform: translate(-0.2px, 0.12px); }
        33%, 63% { transform: translate(0, 0); }
        66% { transform: translate(-0.15px, 0.09px); }
        69%, 82% { transform: translate(0, 0); }
        87%, 100% { transform: translate(2.75px, -1.61px); }
      }

      /* Eyes drop to the floor first */
      @keyframes low-look {
        0%, 2% { transform: translate(0, 0); }
        6%, 84% { transform: translate(0, 1px); }
        94%, 100% { transform: translate(0, 0); }
      }

      @keyframes low-blink {
        0%, 2% { transform: scaleY(1); }
        5% { transform: scaleY(1.2); }
        10%, 18% { transform: scaleY(1); }
        24% { transform: scaleY(0.8); }
        30%, 92% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
        98%, 100% { transform: scaleY(1); }
      }

      @keyframes low-eyes-open {
        0% { opacity: 1; }
        34% { opacity: 0; }
        86% { opacity: 1; }
      }

      @keyframes low-eyes-happy {
        0% { opacity: 0; }
        34% { opacity: 1; }
        86% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs (bend in the crouch) -->
  <g class="legs-jump">
    <g id="legs" fill="#DE886D">
      <rect x="3" y="12" width="1" height="3"/>
      <rect x="5" y="12" width="1" height="3"/>
      <rect x="9" y="12" width="1" height="3"/>
      <rect x="11" y="12" width="1" height="3"/>
    </g>
  </g>

  <!-- Animated Upper Body -->
  <g class="body-jump">
    <g class="body-squash">
      <!-- Torso -->
      <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <!-- Left Arm -->
      <g class="arm-l">
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Right Arm -->
      <g class="arm-r">
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
      <!-- Arms diving down in front, hands clap between the knees -->
      <g class="clap" fill="#A85A3A">
        <g class="fore-l"><rect x="1.5" y="10" width="5.6" height="1"/></g>
        <g class="fore-r"><rect x="7.9" y="10" width="5.6" height="1"/></g>
        <g class="fist-l"><rect class="fist" x="5.4" y="12.33" width="2.1" height="2.2"/></g>
        <g class="fist-r"><rect class="fist" x="7.5" y="12.33" width="2.1" height="2.2"/></g>
      </g>
      <!-- Eyes (down at the floor) -->
      <g class="eyes-open">
        <g class="eyes-look">
          <g class="eyes-blink" fill="#000000">
            <rect x="4" y="8" width="1" height="2"/>
            <rect x="10" y="8" width="1" height="2"/>
          </g>
        </g>
      </g>
      <!-- Happy "^^" eyes while holding it -->
      <g class="eyes-happy" fill="#000000">
        <rect x="3" y="9" width="1" height="1"/>
        <rect x="4" y="8" width="1" height="1"/>
        <rect x="5" y="9" width="1" height="1"/>
        <rect x="9" y="9" width="1" height="1"/>
        <rect x="10" y="8" width="1" height="1"/>
        <rect x="11" y="9" width="1" height="1"/>
      </g>
    </g>
  </g>
</svg>
