<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      /* 2-Second Loop — Fetch exit (right): parked at the right screen edge (screen edge at u = 16.5). He peeks out past the edge, snaps back to you with sly half-lidded "shh" eyes and a shifty glance, crouches, then ZIPS out through the edge (stretched, dust puff, speed lines), fading before the window edge. The frame stays empty for the last second: the edge trembles and a few dust bits get tossed back in while he rummages off-screen; everything is gone by 1.85 s. */
      .fx-c-root {
        transform-origin: 15px 0px;
        animation: fx-c-root 2s infinite ease-in-out;
      }

      .fx-c-fade {
        animation: fx-c-fade 2s infinite ease-in-out;
      }

      .fx-c-shadow {
        transform-origin: 7.5px 15.5px;
        animation: fx-c-shadow 2s infinite ease-in-out;
      }

      .fx-c-hop {
        transform-origin: 15px 0px;
        animation: fx-c-hop 2s infinite ease-in-out;
      }

      .fx-c-legs {
        transform-origin: 7.5px 15px;
        animation: fx-c-legs 2s infinite ease-in-out;
      }

      .fx-c-leg1 {
        transform-origin: 15px 0px;
        animation: fx-c-leg1 2s infinite ease-in-out;
      }

      .fx-c-leg2 {
        transform-origin: 15px 0px;
        animation: fx-c-leg2 2s infinite ease-in-out;
      }

      .fx-c-leg3 {
        transform-origin: 15px 0px;
        animation: fx-c-leg3 2s infinite ease-in-out;
      }

      .fx-c-leg4 {
        transform-origin: 15px 0px;
        animation: fx-c-leg4 2s infinite ease-in-out;
      }

      .fx-c-body {
        transform-origin: 7.5px 15px;
        animation: fx-c-body 2s infinite ease-in-out;
      }

      .fx-c-arm-l {
        transform-origin: 13px 10px;
        animation: fx-c-arm-l 2s infinite ease-in-out;
      }

      .fx-c-arm-r {
        transform-origin: 2px 10px;
        animation: fx-c-arm-r 2s infinite ease-in-out;
      }

      .fx-c-eyes {
        transform-origin: 15px 0px;
        animation: fx-c-eyes 2s infinite ease-in-out;
      }

      .fx-c-lid {
        transform-origin: 7.5px 10px;
        animation: fx-c-lid 2s infinite ease-in-out;
      }

      .fx-c-eye-s {
        animation: fx-c-eye-s 2s infinite ease-in-out;
      }

      .fx-c-eye-h {
        animation: fx-c-eye-h 2s infinite ease-in-out;
      }

      .fx-puff0 {
        transform-origin: 11.8px 14.3px;
        animation: fx-puff0 2s infinite ease-in-out;
      }

      .fx-puff1 {
        transform-origin: 7.9px 14.6px;
        animation: fx-puff1 2s infinite ease-in-out;
      }

      .fx-puff2 {
        transform-origin: 3.8px 14.4px;
        animation: fx-puff2 2s infinite ease-in-out;
      }

      .fx-puff3 {
        transform-origin: 1.3px 14.7px;
        animation: fx-puff3 2s infinite ease-in-out;
      }

      .fx-line0 {
        transform-origin: 14px 8.2px;
        animation: fx-line0 2s infinite ease-in-out;
      }

      .fx-line1 {
        transform-origin: 16px 10.6px;
        animation: fx-line1 2s infinite ease-in-out;
      }

      .fx-line2 {
        transform-origin: 13px 13px;
        animation: fx-line2 2s infinite ease-in-out;
      }

      .fx-junk0 {
        transform-origin: 16.5px 12px;
        animation: fx-junk0 2s infinite ease-in-out;
      }

      .fx-junk1 {
        transform-origin: 16.5px 10px;
        animation: fx-junk1 2s infinite ease-in-out;
      }

      .fx-junk2 {
        transform-origin: 16px 13px;
        animation: fx-junk2 2s infinite ease-in-out;
      }

      .fx-grit0 {
        transform-origin: 15px 0px;
        animation: fx-grit0 2s infinite ease-in-out;
      }

      .fx-grit1 {
        transform-origin: 15px 0px;
        animation: fx-grit1 2s infinite ease-in-out;
      }

      @keyframes fx-c-root {
0%,35%{transform:translate(0px,0px)}
38.5%{transform:translate(-0.5px,0px);animation-timing-function:cubic-bezier(.55,0,.85,.4)}
44%{transform:translate(0.4px,0px);animation-timing-function:linear}
45.75%{transform:translate(3px,0px);animation-timing-function:linear}
47%{transform:translate(6.5px,0px);animation-timing-function:linear}
48.25%{transform:translate(10.5px,0px);animation-timing-function:linear}
49.5%{transform:translate(16px,0px)}
50%,100%{transform:translate(18px,0px)}
}

      @keyframes fx-c-fade {
