62.5%{transform:translate(0px,0px);opacity:1;animation-timing-function:linear}
66%{transform:translate(-1.6px,-3.2px);opacity:1;animation-timing-function:linear}
69.5%{transform:translate(-3px,-3.8px);opacity:1;animation-timing-function:cubic-bezier(.2,.75,.35,1)}
73.5%{transform:translate(-4.2px,-1.2px);opacity:1;animation-timing-function:cubic-bezier(.55,0,.85,.4)}
77%{transform:translate(-5px,2.5px);opacity:1;animation-timing-function:cubic-bezier(.55,0,.85,.4)}
