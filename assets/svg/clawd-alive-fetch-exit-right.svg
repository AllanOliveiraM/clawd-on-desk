}

      @keyframes fx-c-body {
0%,3.5%{transform:translate(0px,0px) skewX(0deg) scale(1,1)}
11%{transform:translate(0.5px,0px) skewX(-10deg) scale(0.97,1.03)}
15.5%{transform:translate(0.7px,0px) skewX(-11deg) scale(0.97,1.03)}
19.5%{transform:translate(-0.1px,0px) skewX(1.5deg) scale(1.03,0.97)}
22.5%,31.5%{transform:translate(0px,0px) skewX(0deg) scale(1.06,0.93)}
35%,38.5%{transform:translate(-0.7px,0px) skewX(8deg) scale(1.07,0.9)}
40%{transform:translate(-0.9px,0px) skewX(10deg) scale(1.08,0.88)}
44%{transform:translate(-0.9px,0px) skewX(10deg) scale(1.08,0.88);animation-timing-function:cubic-bezier(.55,0,.85,.4)}
46%,100%{transform:translate(0.6px,0px) skewX(-16deg) scale(1.28,0.84)}
}

      @keyframes fx-c-arm-l {
0%,3.5%,19.5%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}
11%,15.5%{transform:translate(0px,-1.2px) rotate(-18deg) scale(1.2,1)}
22.5%,31.5%{transform:translate(0px,-0.6px) rotate(0deg) scale(1,1)}
35%,44%{transform:translate(0px,-0.3px) rotate(0deg) scale(1,1)}
46%,100%{transform:translate(0px,-1px) rotate(0deg) scale(1.7,1)}
}

      @keyframes fx-c-arm-r {
0%,19.5%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}
22.5%,31.5%{transform:translate(0px,-0.6px) rotate(0deg) scale(1,1)}
35%,38.5%{transform:translate(0px,-0.8px) rotate(15deg) scale(1,1)}
40%,44%{transform:translate(0px,-1.2px) rotate(35deg) scale(1,1)}
46%,100%{transform:translate(0px,-1.5px) rotate(50deg) scale(1.3,1)}
}

      @keyframes fx-c-eyes {
