  </defs>

  <!-- Clawd -->
  <g class="fx-c-root">
    <g class="fx-c-fade">
      <g class="fx-c-shadow">
        <rect x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>
      </g>
      <g class="fx-c-hop">
        <g class="fx-c-legs">
          <g id="legs" fill="#DE886D">
            <g class="fx-c-leg1">
              <rect x="11" y="11" width="1" height="4"/>
            </g>
            <g class="fx-c-leg2">
              <rect x="9" y="11" width="1" height="4"/>
            </g>
            <g class="fx-c-leg3">
              <rect x="5" y="11" width="1" height="4"/>
            </g>
            <g class="fx-c-leg4">
              <rect x="3" y="11" width="1" height="4"/>
            </g>
          </g>
        </g>
        <g class="fx-c-body">
          <g class="fx-c-arm-r">
            <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
          </g>
          <g class="fx-c-tor">
            <rect x="2" y="6" width="11" height="7" fill="#DE886D" id="torso"/>
          </g>
          <g class="fx-c-arm-l">
            <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
          </g>
          <g class="fx-c-eyes" fill="#000000">
            <g class="fx-c-eye-n">
              <g class="fx-c-lid">
                <rect x="10" y="8" width="1" height="2"/>
                <rect x="4" y="8" width="1" height="2"/>
              </g>
            </g>
            <g class="fx-c-eye-s">
              <rect x="11" y="7.5" width="1" height="1"/>
              <rect x="10" y="8.5" width="1" height="1"/>
              <rect x="11" y="9.5" width="1" height="1"/>
              <rect x="3" y="7.5" width="1" height="1"/>
              <rect x="4" y="8.5" width="1" height="1"/>
              <rect x="3" y="9.5" width="1" height="1"/>
            </g>
            <g class="fx-c-eye-h">
              <rect x="11" y="9" width="1" height="1"/>
              <rect x="10" y="8" width="1" height="1"/>
              <rect x="9" y="9" width="1" height="1"/>
              <rect x="5" y="9" width="1" height="1"/>
              <rect x="4" y="8" width="1" height="1"/>
              <rect x="3" y="9" width="1" height="1"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
  <!-- dust puff and speed lines -->
  <g>
    <g class="fx-puff0">
      <rect x="11.1" y="13.8" width="1.4" height="1" fill="#C8B49E"/>
    </g>
    <g class="fx-puff1">
      <rect x="7.3" y="14.1" width="1.2" height="1" fill="#C8B49E"/>
    </g>
    <g class="fx-puff2">
      <rect x="3.1" y="13.9" width="1.4" height="1" fill="#C8B49E"/>
    </g>
    <g class="fx-puff3">
      <rect x="0.8" y="14.2" width="1" height="1" fill="#C8B49E"/>
    </g>
    <g class="fx-line0">
      <rect x="0" y="8.2" width="12" height="0.5" fill="#8E8E8E"/>
    </g>
    <g class="fx-line1">
      <rect x="1.5" y="10.6" width="12.5" height="0.5" fill="#8E8E8E"/>
    </g>
    <g class="fx-line2">
      <rect x="0.5" y="13" width="10.5" height="0.5" fill="#8E8E8E"/>
    </g>
  </g>
  <!-- rummaging off-screen -->
  <g>
    <g class="fx-junk0">
      <rect x="16" y="11.5" width="1" height="1" fill="#C8B49E"/>
    </g>
    <g class="fx-junk1">
      <rect x="16" y="9.5" width="1" height="1" fill="#9C8C7C"/>
    </g>
    <g class="fx-junk2">
      <rect x="15" y="12.5" width="2" height="1" fill="#9C8C7C"/>
    </g>
    <g class="fx-grit0">
