46.5%{transform:translate(0px,0px) scale(1,1);opacity:0.95;animation-timing-function:cubic-bezier(.2,.75,.35,1)}
57.5%{transform:translate(2.2px,-1.6px) scale(1.3,1.3);opacity:0.7}
65.5%,100%{transform:translate(2.86px,-1.92px) scale(1.3,1.3);opacity:0}
