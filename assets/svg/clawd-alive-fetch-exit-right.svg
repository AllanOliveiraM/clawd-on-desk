0%{transform:translate(0px,0px);opacity:0}
66.95%{transform:translate(0px,0px);opacity:0;animation-timing-function:cubic-bezier(.55,0,.85,.4)}
67%{transform:translate(0px,0px);opacity:1;animation-timing-function:linear}
70.2%{transform:translate(-2.6px,-4px);opacity:1;animation-timing-function:linear}
73.4%{transform:translate(-5px,-4.6px);opacity:1;animation-timing-function:cubic-bezier(.2,.75,.35,1)}
77%{transform:translate(-7px,-1px);opacity:1;animation-timing-function:cubic-bezier(.55,0,.85,.4)}
