47.75%{transform:translate(0px,0px) scale(1,1);opacity:0.95;animation-timing-function:cubic-bezier(.2,.75,.35,1)}
58.75%{transform:translate(1.2px,-2.4px) scale(1.3,1.3);opacity:0.7}
66.75%,100%{transform:translate(1.56px,-2.88px) scale(1.3,1.3);opacity:0}
}

      @keyframes fx-puff2 {
0%{transform:translate(0px,0px) scale(1,1);opacity:0}
46.95%{transform:translate(0px,0px) scale(0.4,0.4);opacity:0;animation-timing-function:cubic-bezier(.2,.75,.35,1)}
49%{transform:translate(0px,0px) scale(1,1);opacity:0.95;animation-timing-function:cubic-bezier(.2,.75,.35,1)}
60%{transform:translate(-0.8px,-1.8px) scale(1.3,1.3);opacity:0.7}
68%,100%{transform:translate(-1.04px,-2.16px) scale(1.3,1.3);opacity:0}
}

      @keyframes fx-puff3 {
0%{transform:translate(0px,0px) scale(1,1);opacity:0}
48.2%{transform:translate(0px,0px) scale(0.4,0.4);opacity:0;animation-timing-function:cubic-bezier(.2,.75,.35,1)}
50.25%{transform:translate(0px,0px) scale(1,1);opacity:0.95;animation-timing-function:cubic-bezier(.2,.75,.35,1)}
61.25%{transform:translate(-1.6px,-0.9px) scale(1.3,1.3);opacity:0.7}
69.25%,100%{transform:translate(-2.08px,-1.08px) scale(1.3,1.3);opacity:0}
}

      @keyframes fx-line0 {
0%{transform:scale(1,1);opacity:0}
45.2%{transform:scale(0.3,1);opacity:0;animation-timing-function:cubic-bezier(.2,.75,.35,1)}
47.25%{transform:scale(1,1);opacity:0.75}
56.75%,100%{transform:scale(0.15,1);opacity:0}
}

      @keyframes fx-line1 {
0%{transform:scale(1,1);opacity:0}
45.95%{transform:scale(0.3,1);opacity:0;animation-timing-function:cubic-bezier(.2,.75,.35,1)}
48%{transform:scale(1,1);opacity:0.75}
57.5%,100%{transform:scale(0.15,1);opacity:0}
}

      @keyframes fx-line2 {
0%{transform:scale(1,1);opacity:0}
46.7%{transform:scale(0.3,1);opacity:0;animation-timing-function:cubic-bezier(.2,.75,.35,1)}
48.75%{transform:scale(1,1);opacity:0.75}
58.25%,100%{transform:scale(0.15,1);opacity:0}
}

